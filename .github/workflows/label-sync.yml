name: Label Sync (Reusable)

# Reusable workflow — synchronizes the canonical Orion label set to the
# calling repository using EndBug/label-sync.
#
# Caller usage (no secrets needed; the calling job must grant at least these):
#   permissions:
#     contents: read
#     issues: write
#   uses: orion-digital-solutions/.github/.github/workflows/label-sync.yml@main
#
# ── What it does ─────────────────────────────────────────────────────────────
# 1. Checks out orion-digital-solutions/.github to read labels.yml.
# 2. Runs EndBug/label-sync, which creates or updates labels in the calling
#    repository to match labels.yml.
# 3. By default, labels present in the repo but absent from labels.yml are
#    LEFT INTACT (`delete-other-labels: false`).  Set the input to true if
#    you want a strict sync that removes unrecognised labels.
#
# ── Token requirements ────────────────────────────────────────────────────────
# The GITHUB_TOKEN of the calling repository requires `issues: write`
# permission (labels are part of the Issues API).  This is declared on the
# job below, but a called workflow can never exceed its caller, so the
# calling job must also grant `issues: write` (see Caller usage above).
# No secrets need to be passed: GITHUB_TOKEN is always available.
#
# ── Org-wide bootstrap ────────────────────────────────────────────────────────
# To apply the canonical label set to every org repository in one pass, run
# the following from a machine with the gh CLI authenticated as an org admin:
#
#   gh repo list orion-digital-solutions --limit 200 --json nameWithOwner \
#     --jq '.[].nameWithOwner' \
#     | xargs -I{} gh workflow run label-sync.yml --repo {} \
#         -f delete-other-labels=false
#
# Or trigger the workflow_dispatch in the workflow-template caller below once
# it has been added to each project repository.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      delete-other-labels:
        description: "Remove labels in the repo that are not in labels.yml"
        required: false
        type: boolean
        default: false

      runner:
        description: "GitHub Actions runner label"
        required: false
        type: string
        default: "ubuntu-latest"

# Default for any job without its own block: read-only.
permissions:
  contents: read

jobs:
  sync:
    name: Sync Labels
    runs-on: ${{ inputs.runner }}
    # contents: read for the labels.yml checkout; issues: write to manage labels.
    permissions:
      contents: read
      issues: write

    steps:
      # Check out THIS .github repo to get the canonical labels.yml.
      # The calling project repo's code is NOT needed for this workflow.
      - name: Checkout orion-digital-solutions/.github (labels source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: orion-digital-solutions/.github
          # Moves to the release tag (v1) in Phase 5.
          ref: main
          sparse-checkout: labels.yml
          sparse-checkout-cone-mode: false

      # Kept on v2.3.3 (last release, February 2024; ROADMAP 3.7). Its
      # action.yml declares `using: node20`, a removed runtime, so the runner
      # remaps it to Node 24. Replace it with a `gh label` script if that
      # remap ever stops.
      - name: Sync labels to ${{ github.repository }}
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          # A local path; `source` is not an input of this action and was ignored.
          # The leading ./ matters: the action's isURL() regex treats a bare
          # "labels.yml" as a domain name and tries to download it over HTTP.
          config-file: ./labels.yml
          delete-other-labels: ${{ inputs.delete-other-labels }}
          request-token: ${{ secrets.GITHUB_TOKEN }}
