name: Docker Best Practices (Reusable)

# Reusable workflow — comprehensive Dockerfile quality, security, and compliance pipeline.
#
# Caller usage:
#   uses: orion-digital-solutions/.github/.github/workflows/docker-lint.yml@v2
#   permissions:               # union of what the jobs below request — a called
#     contents: write          # workflow can never be granted more than its caller
#     security-events: write
#     actions: read
#     id-token: write
#     attestations: write
#   with:
#     dockerfile: "Dockerfile"
#     image-name: "myapp:ci"
#   secrets:
#     AZURE_NPM_TOKEN: ${{ secrets.AZURE_NPM_TOKEN }}   # optional; only if the build pulls private npm packages
#
# ── Pipeline stages ───────────────────────────────────────────────────────────
#
# Both jobs are thin wrappers around composite actions in this repository,
# referenced with the self-repository prefix `$/`, so they always come from the
# same commit as this workflow (docs/v2-design.md). The v2 orchestrator calls
# the same actions directly.
#
#   Always runs (no image build needed):
#     lint   ──► $/.github/actions/docker-lint (one target)
#                Hadolint 2.12 (pinned binary) + Checkov (pinned image)
#                + multi-stage build advisory
#
#   Only when build-image: true (default false — see note below), in parallel
#   with lint:
#     build  ──► $/.github/actions/docker-image
#                buildx build (GitHub Actions cache) + OCI label verification
#                + Trivy CVE scan (one scan; table, JSON and SARIF via
#                  `trivy convert`) + optional Grype
#                + Syft container SBOM (SPDX + CycloneDX, workflow artifacts)
#                + Dive image efficiency check
#                Read-only job (ROADMAP 1.3): it builds a possibly PR-supplied
#                Dockerfile, so it holds no write scope beyond SARIF upload.
#
#   Only when the SBOM is to be published (sbom-attach-to-release on a release
#   event, or sbom-attest), after build:
#     publish ──► downloads the SBOM artifacts; gh release upload and/or
#                 actions/attest. Runs no repository code (no checkout).
#
# v2 change: the former `scan`, `image-sbom` and `efficiency` jobs are steps of
# `build` now (no image tarball is passed between jobs), so the checks
# "Vulnerability Scanning", "Container Image SBOM" and "Image Efficiency
# (Dive)" no longer exist; their result is part of "Build Docker Image", and
# SBOM publishing is the new "Publish container SBOM" job. The image checks no
# longer wait for lint: a lint failure still fails the run, but the image is
# scanned anyway.
#
# ── Lint-only by default ──────────────────────────────────────────────────────
# build-image defaults to false, so by default this workflow ONLY lints and
# validates the Dockerfile (Hadolint + Checkov) — fast feedback, no Docker build.
# Set build-image: true to build the image and run the CVE scan, container SBOM,
# and Dive efficiency checks — typically in a CD pipeline where the image is
# built anyway, or for an on-demand/full image scan.
#
# ── What SARIF findings appear where ─────────────────────────────────────────
#   GitHub Security tab  ←  Hadolint · Checkov · Trivy · Grype (when upload-sarif: true)
#   Workflow artifacts   ←  docker-lint-result · docker-vuln-report (Trivy JSON)
#                           · docker-sbom (SPDX + CycloneDX)
#
# ── OCI label injection ───────────────────────────────────────────────────────
# The build automatically injects org.opencontainers.image.source,
# .revision, .created, and .ref.name as image labels.
# If enforce-labels is true, the built image is inspected to confirm all
# required-labels are present (fails the build job if any are missing; the
# image is then not scanned, as in v1).
#
# ── Multi-stage build advisory ────────────────────────────────────────────────
# The lint job counts FROM instructions and emits a warning (not a failure) if
# only one stage is found. This is advisory — some Dockerfiles (e.g. scratch
# or distroless base images) legitimately use a single stage.
#
# ── Build cache ──────────────────────────────────────────────────────────────
# The build uses the GitHub Actions cache (type=gha), scoped per target-id.
# It is turned off on release events, so a published SBOM always comes from a
# clean build.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      # ── Dockerfile location ────────────────────────────────────────────────
      dockerfile:
        description: "Relative path to the Dockerfile from the repository root"
        required: false
        type: string
        default: "Dockerfile"

      context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."

      image-name:
        description: "Name and tag for the built image used during CI (e.g. myapp:ci)"
        required: false
        type: string
        default: "orion-docker-check:ci"

      # ── Monorepo target discriminator ──────────────────────────────────────
      # When this workflow is fanned out across MULTIPLE Dockerfiles in the same
      # run (a monorepo matrix in the CI orchestrator), each leg must produce
      # uniquely-named artifacts and SARIF categories — otherwise legs clobber
      # each other's image/vuln/SBOM artifacts and Security-tab results for the
      # same commit. Pass a stable per-target slug (e.g. "apps-api-Dockerfile").
      # Leave blank (the default) for a single-Dockerfile repo: every artifact
      # name and SARIF category is then byte-for-byte identical to before.
      target-id:
        description: "Per-target slug appended to artifact names and SARIF categories when fanning out across multiple Dockerfiles. Leave blank for single-Dockerfile repos."
        required: false
        type: string
        default: ""

      build-args:
        description: "Newline-separated Docker build arguments (KEY=VALUE), passed as --build-arg"
        required: false
        type: string
        default: ""

      # ── Image build control ────────────────────────────────────────────────
      build-image:
        description: "Build the image and run the image-dependent jobs (CVE scan, container SBOM, Dive). When false (default), only Dockerfile linting (Hadolint + Checkov) runs — build and scan the image in your CD pipeline instead."
        required: false
        type: boolean
        default: false

      # ── Static analysis ────────────────────────────────────────────────────
      hadolint-version:
        description: "Hadolint version to use (e.g. v2.12.0)"
        required: false
        type: string
        default: "v2.12.0"

      hadolint-ignore:
        description: "Hadolint rule IDs to ignore, comma- or space-separated (e.g. DL3008,SC2035)"
        required: false
        type: string
        default: ""

      checkov-skip-check:
        description: "Comma-separated Checkov check IDs to skip (e.g. CKV_DOCKER_2,CKV_DOCKER_7)"
        required: false
        type: string
        default: ""

      # ── Vulnerability scanning ─────────────────────────────────────────────
      trivy-severity:
        description: "Comma-separated severity levels that trigger a scan failure"
        required: false
        type: string
        default: "CRITICAL,HIGH"

      trivy-exit-code:
        description: "Exit code when vulnerabilities at trivy-severity are found (0 = warn, 1 = fail)"
        required: false
        type: number
        default: 1

      trivy-ignore-unfixed:
        description: "Skip CVEs that have no fix available yet (recommended for base image noise)"
        required: false
        type: boolean
        default: false

      grype-enable:
        description: "Run a Grype vulnerability scan in addition to Trivy"
        required: false
        type: boolean
        default: false

      # ── Container SBOM ─────────────────────────────────────────────────────
      sbom-enable:
        description: "Generate a container image SBOM (SPDX JSON + CycloneDX JSON via Syft)"
        required: false
        type: boolean
        default: true

      sbom-artifact-name:
        description: "Prefix used for SBOM artifact names uploaded to the workflow run"
        required: false
        type: string
        default: "docker-sbom"

      sbom-attach-to-release:
        description: "Attach container SBOMs as assets to the GitHub Release (release event only)"
        required: false
        type: boolean
        default: true

      sbom-attest:
        description: "Publish a signed SBOM attestation to the repo attestation store (requires id-token: write)"
        required: false
        type: boolean
        default: false

      # ── Image efficiency ───────────────────────────────────────────────────
      dive-enable:
        description: "Run Dive image efficiency check in CI mode"
        required: false
        type: boolean
        default: true

      dive-min-efficiency:
        description: "Minimum image efficiency (0.0–1.0). Pipeline fails if the image scores below this"
        required: false
        type: number
        default: 0.9

      # ── OCI label enforcement ──────────────────────────────────────────────
      enforce-labels:
        description: "Fail the build job if required OCI labels are absent from the built image"
        required: false
        type: boolean
        default: true

      required-labels:
        description: "Comma-separated OCI label keys that must be present in the built image"
        required: false
        type: string
        default: "org.opencontainers.image.source,org.opencontainers.image.revision,org.opencontainers.image.created"

      # ── Reporting ──────────────────────────────────────────────────────────
      upload-sarif:
        description: "Upload SARIF results to the GitHub Security tab (Code Scanning)"
        required: false
        type: boolean
        default: true

      artifact-retention-days:
        description: "Retention period in days for uploaded report artifacts"
        required: false
        type: number
        default: 7

      # ── Runner ─────────────────────────────────────────────────────────────
      runner:
        description: "GitHub Actions runner label"
        required: false
        type: string
        default: "ubuntu-latest"

    secrets:
      AZURE_NPM_TOKEN:
        description: "Read-only npm registry token, mounted only as a BuildKit secret (never a build-arg)"
        required: false

# Least privilege: read-only by default; each job below requests only what it
# needs. Write scopes live solely on the jobs that use them.
permissions:
  contents: read

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Job 1 — Static Analysis & Linting (runs in parallel with build)
  # ════════════════════════════════════════════════════════════════════════════
  lint:
    name: Static Analysis & Linting
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read           # checkout
      security-events: write   # upload Hadolint/Checkov SARIF to the Security tab
      actions: read            # SARIF upload reads workflow run metadata (private repos)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One target. toJSON() quotes and escapes each value, so the list is
      # valid JSON whatever the paths contain. With one target the artifact
      # and SARIF categories keep their v1 names: docker-lint-result[-<id>],
      # hadolint-dockerfile[-<id>], checkov-dockerfile[-<id>].
      - name: Dockerfile lint
        uses: $/.github/actions/docker-lint
        with:
          targets: ${{ format('[{{"dockerfile":{0},"context":{1},"target-id":{2}}}]', toJSON(inputs.dockerfile), toJSON(inputs.context), toJSON(inputs.target-id)) }}
          hadolint-ignore: ${{ inputs.hadolint-ignore }}
          hadolint-version: ${{ inputs.hadolint-version }}
          checkov-skip-check: ${{ inputs.checkov-skip-check }}
          upload-sarif: ${{ inputs.upload-sarif }}
          artifact-name: docker-lint-result${{ inputs.target-id != '' && format('-{0}', inputs.target-id) || '' }}
          artifact-retention-days: ${{ inputs.artifact-retention-days }}
          fail-on-findings: "true"

  # ════════════════════════════════════════════════════════════════════════════
  # Job 2 — Build, scan, SBOM and efficiency of the image (opt-in)
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: Build Docker Image
    if: inputs.build-image
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90          # v1: build 60, then scan 30 / SBOM 20 / Dive 20 in parallel
    # Read-only (ROADMAP 1.3): this job executes the (possibly PR-supplied)
    # Dockerfile. Release upload and attestation happen in `publish`.
    permissions:
      contents: read           # checkout
      security-events: write   # upload Trivy/Grype SARIF to the Security tab
      actions: read            # SARIF upload reads workflow run metadata (private repos)
    outputs:
      image-name: ${{ steps.image.outputs.image-name }}
      image-id: ${{ steps.image.outputs.image-id }}
      sbom-spdx-artifact: ${{ steps.image.outputs.sbom-spdx-artifact }}
      sbom-spdx-file: ${{ steps.image.outputs.sbom-spdx-file }}
      sbom-cyclonedx-artifact: ${{ steps.image.outputs.sbom-cyclonedx-artifact }}
      sbom-cyclonedx-file: ${{ steps.image.outputs.sbom-cyclonedx-file }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check image
        id: image
        uses: $/.github/actions/docker-image
        with:
          dockerfile: ${{ inputs.dockerfile }}
          context: ${{ inputs.context }}
          image-name: ${{ inputs.image-name }}
          target-id: ${{ inputs.target-id }}
          build-args: ${{ inputs.build-args }}
          npm-token: ${{ secrets.AZURE_NPM_TOKEN }}
          gha-cache: ${{ github.event_name != 'release' }}
          enforce-labels: ${{ inputs.enforce-labels }}
          required-labels: ${{ inputs.required-labels }}
          trivy-severity: ${{ inputs.trivy-severity }}
          trivy-exit-code: ${{ inputs.trivy-exit-code }}
          trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          grype-enable: ${{ inputs.grype-enable }}
          sbom-enable: ${{ inputs.sbom-enable }}
          sbom-artifact-name: ${{ inputs.sbom-artifact-name }}
          dive-enable: ${{ inputs.dive-enable }}
          dive-min-efficiency: ${{ inputs.dive-min-efficiency }}
          upload-sarif: ${{ inputs.upload-sarif }}
          artifact-retention-days: ${{ inputs.artifact-retention-days }}
          fail-on-findings: "true"

  # ════════════════════════════════════════════════════════════════════════════
  # Job 3 — Publish the container SBOM (release asset and/or attestation)
  # ════════════════════════════════════════════════════════════════════════════
  # Holds the write scopes the build job must not have. Runs no repository
  # code: no checkout, only the SBOM files the build job uploaded. Runs even
  # when the build job failed on a scan or Dive finding (as v1's image-sbom job
  # did), but only for SBOMs that build actually produced: the outputs are
  # empty when the image did not build or lacked a required label.
  publish:
    name: Publish container SBOM
    needs: build
    if: >-
      ${{ !cancelled()
          && inputs.build-image && inputs.sbom-enable
          && ((inputs.sbom-attach-to-release && github.event_name == 'release') || inputs.sbom-attest)
          && (needs.build.outputs.sbom-spdx-artifact != '' || needs.build.outputs.sbom-cyclonedx-artifact != '') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: write          # gh release upload (release event, sbom-attach-to-release)
      id-token: write          # Sigstore OIDC signing for the SBOM attestation (sbom-attest)
      attestations: write      # store the signed attestation

    steps:
      - name: Download SPDX SBOM
        if: needs.build.outputs.sbom-spdx-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.sbom-spdx-artifact }}
          path: ${{ runner.temp }}/sbom

      - name: Download CycloneDX SBOM
        if: needs.build.outputs.sbom-cyclonedx-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.sbom-cyclonedx-artifact }}
          path: ${{ runner.temp }}/sbom

      - name: Attach SBOMs to the GitHub Release
        if: inputs.sbom-attach-to-release && github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          SBOM_DIR: ${{ runner.temp }}/sbom
          SPDX_FILE: ${{ needs.build.outputs.sbom-spdx-file }}
          CDX_FILE: ${{ needs.build.outputs.sbom-cyclonedx-file }}
        run: |
          set -euo pipefail
          FILES=()
          for f in "${SPDX_FILE}" "${CDX_FILE}"; do
            if [ -n "${f}" ]; then FILES+=("${SBOM_DIR}/${f}"); fi
          done
          gh release upload "${TAG}" "${FILES[@]}" --clobber --repo "${REPO}"
          {
            echo "### Container SBOM published"
            echo ""
            for f in "${SPDX_FILE}" "${CDX_FILE}"; do
              if [ -n "${f}" ]; then echo "- \`${f}\` attached to GitHub Release **${TAG}**"; fi
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      # actions/attest with sbom-path creates the same SBOM attestation the
      # deprecated actions/attest-sbom did. Subject = the image built by the
      # build job (name and image ID from its outputs).
      - name: Attest container SBOM (SPDX)
        if: inputs.sbom-attest && needs.build.outputs.sbom-spdx-file != '' && needs.build.outputs.image-id != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image-name }}
          subject-digest: ${{ needs.build.outputs.image-id }}
          sbom-path: ${{ runner.temp }}/sbom/${{ needs.build.outputs.sbom-spdx-file }}
