name: Secret Scanning (Reusable)

# Reusable workflow — Gitleaks secret detection across all Orion repositories.
#
# Caller usage:
#   uses: orion-digital-solutions/.github/.github/workflows/secret-scanning.yml@v1
#   secrets: inherit
#
# ── Delta scanning behaviour ──────────────────────────────────────────────────
# Pull requests  → scans only the commits in the PR diff (not full history).
# Push to branch → scans only the newly pushed commits. After a force-push
#                  (old head gone) → the new head's commits that are on no
#                  other branch, with a warning.
# Scheduled run  → full repository history scan.
#
# ── Artifacts ────────────────────────────────────────────────────────────────
# Uploads `gitleaks-report` artifact (JSON) after every scan.
# The CI orchestrator report job reads this artifact to render findings.
#
# ── Custom rules ─────────────────────────────────────────────────────────────
# Place a .gitleaks.toml file in the calling repository root to extend or
# override rules (e.g. to allowlist known false positives).
# On pull requests the config and .gitleaksignore are read from the BASE
# branch, not the PR head, so a PR cannot allowlist its own secret: a new or
# changed .gitleaks.toml / .gitleaksignore takes effect only once it is merged.
# Other events use the checked-out files. Inline `gitleaks:allow` comments in
# the PR's own lines are still honoured; reviewers should watch for them.
#
# ── Implementation ───────────────────────────────────────────────────────────
# The steps live in the composite action .github/actions/secret-scan, which
# the CI orchestrator also runs inside its fast-checks job (v2). This
# workflow keeps the v1 interface: inputs, secret, job id and job name.
#
# ── Exit status ──────────────────────────────────────────────────────────────
# Gitleaks runs with --exit-code 2: 0 = clean, 2 = secrets found, anything
# else = Gitleaks failed to run (reported as such, not as a finding). A git
# error during the scan also counts as a failure (see the scan step).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      full-scan:
        description: "Scan the full git history (forced on schedule events)"
        required: false
        type: boolean
        default: false

      gitleaks-version:
        # Keep in sync with the gitleaks-version default and PINNED_VERSION /
        # PINNED_SHA256 in .github/actions/secret-scan/action.yml.
        description: "Gitleaks version to pin (e.g. v8.30.1). Versions before v8.19.0 fall back to the deprecated `detect` command with a warning"
        required: false
        type: string
        default: "v8.30.1"

      runner:
        description: "GitHub Actions runner label"
        required: false
        type: string
        default: "ubuntu-latest"

    secrets:
      GITLEAKS_LICENSE:
        description: "Gitleaks license key (optional)"
        required: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    # Read-only: checkout needs contents; the artifact upload uses the runtime
    # token, not GITHUB_TOKEN.
    permissions:
      contents: read

    steps:
      # fetch-depth: 0 required for delta log-opts to resolve commit ranges
      # and for the base-branch .gitleaks.toml / .gitleaksignore on PRs.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Install, range, config, scan, report, artifact and the final
      # pass/fail all live in the composite action (same commit as this
      # workflow, via the self-repository `$/` prefix).
      - name: Gitleaks secret scan
        uses: $/.github/actions/secret-scan
        with:
          full-scan:        ${{ inputs.full-scan }}
          gitleaks-version: ${{ inputs.gitleaks-version }}
          gitleaks-license: ${{ secrets.GITLEAKS_LICENSE }}
