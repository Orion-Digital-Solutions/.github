name: SonarCloud Analysis (Reusable)

# Reusable workflow — single source of truth for SonarCloud scans
# across all Orion Digital Solutions repositories.
#
# Secrets: only SONAR_TOKEN is required here (scanner + Quality Gate).
# The orchestrator CI Report uses SONAR_ISSUE_RETRIEVAL separately — see ci.yml.
#
# ── Coverage (IMPORTANT) ──────────────────────────────────────────────────────
# This workflow does NOT run your tests. The default "Sonar Way" Quality Gate
# requires ≥80% coverage on NEW code — with no coverage report imported, Sonar
# sees 0% and the gate FAILS. To provide coverage:
#   1. An EARLIER job in the same run runs your tests with coverage and produces a
#      Sonar-supported report (JS/TS → lcov.info, Python → coverage.xml, etc.).
#   2. That job uploads the report(s) as an artifact (preserving repo-relative paths).
#   3. Pass `coverage-artifact: <name>` (downloaded here pre-scan) plus the matching
#      report path via python-coverage-report / js-coverage-report / sonar-extra-args.
# Coverage is produced by the project repo and handed to CI — CI never runs tests.
#
# Caller usage:
#   uses: orion-digital-solutions/.github/.github/workflows/sonarcloud.yml@main
#   with:
#     project-key: orion-digital-solutions_my-repo
#   secrets: inherit

on:
  workflow_call:
    inputs:
      # ── Required ──────────────────────────────────────────────────────────
      project-key:
        description: "SonarCloud project key (e.g. orion-digital-solutions_repo-name)"
        required: true
        type: string

      # ── Optional — Project Metadata ───────────────────────────────────────
      project-name:
        description: "Human-readable project name displayed in SonarCloud"
        required: false
        type: string
        default: ""

      sonar-organization:
        description: "SonarCloud organization slug (defaults to orion-digital-solutions)"
        required: false
        type: string
        default: "orion-digital-solutions"

      # ── Optional — Source Configuration ───────────────────────────────────
      base-dir:
        description: >
          sonar.projectBaseDir for the scan. For a monorepo sub-project set its
          path (e.g. apps/web); leave blank for a single-package repo (defaults
          to the repo root). When set, `sources`, `exclusions`, and the coverage
          report-path inputs are interpreted RELATIVE to this directory, and the
          scanner reads sonar-project.properties from here (not the repo root).
        required: false
        type: string
        default: ""

      sources:
        description: "Comma-separated list of source directories to analyse (relative to base-dir when set)"
        required: false
        type: string
        default: "."

      exclusions:
        description: "Glob patterns to exclude from analysis (comma-separated)"
        required: false
        type: string
        default: "**/tests/**,**/test/**,**/__tests__/**,**/node_modules/**,**/vendor/**,**/*.min.js,**/migrations/**"

      # ── Optional — Coverage ───────────────────────────────────────────────
      python-coverage-report:
        description: "Path to Python XML coverage report (e.g. coverage.xml)"
        required: false
        type: string
        default: ""

      js-coverage-report:
        description: "Path to JS/TS LCOV coverage report (e.g. coverage/lcov.info)"
        required: false
        type: string
        default: ""

      coverage-artifact:
        description: >
          Name of a workflow artifact containing coverage report(s) produced by an
          EARLIER job in the same run. When set, this workflow downloads it into the
          workspace before scanning so the report paths below resolve. The artifact's
          internal paths must match the repo-relative paths you pass as report inputs.
        required: false
        type: string
        default: ""

      sonar-extra-args:
        description: >
          Extra raw `-Dsonar.*` properties appended to the scan, space-separated.
          Language-agnostic escape hatch for coverage of languages without a dedicated
          input above (e.g. '-Dsonar.go.coverage.reportPaths=cov.out').
        required: false
        type: string
        default: ""

      # ── Optional — Language / Runtime Setup ──────────────────────────────
      python-version:
        description: "Python version to set up (leave blank to skip Python setup)"
        required: false
        type: string
        default: ""

      node-version:
        description: "Node.js version to set up (leave blank to skip Node setup)"
        required: false
        type: string
        default: ""

      java-version:
        description: "Java version to set up (leave blank to skip Java setup — required for Java/Kotlin/Scala)"
        required: false
        type: string
        default: ""

      # ── Optional — Scan Behaviour ─────────────────────────────────────────
      fetch-depth:
        description: "Git fetch depth (0 = full history, required for blame/new-code detection)"
        required: false
        type: number
        default: 0

      fail-on-quality-gate:
        description: "Fail the workflow if the SonarCloud Quality Gate does not pass"
        required: false
        type: boolean
        default: true

      runner:
        description: "GitHub Actions runner label"
        required: false
        type: string
        default: "ubuntu-latest"

    secrets:
      SONAR_TOKEN:
        description: "SonarCloud authentication token (use the org-level SONAR_TOKEN secret)"
        required: true

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ${{ inputs.runner }}
    # Read-only: checkout needs contents. The scanner and Quality Gate talk to
    # SonarCloud with SONAR_TOKEN, and the same-run artifact download uses the
    # runtime token, so neither needs GITHUB_TOKEN scopes.
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}

      # ── 2. Optional Runtime Setup ────────────────────────────────────────
      - name: Set up Python ${{ inputs.python-version }}
        if: inputs.python-version != ''
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      # The JS/TS/CSS analyzer needs Node.js >= 22.12 (22.x), 24.x or 26.x
      # (https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/languages/javascript-typescript-css).
      # Use the caller's node-version when given; otherwise, if the scanned dir
      # contains JS/TS/CSS files, default to the current Node LTS.
      - name: Resolve Node.js version for the JS/TS analyzer
        id: node
        shell: bash
        env:
          NODE_VERSION_INPUT: ${{ inputs.node-version }}
          BASE_DIR: ${{ inputs.base-dir }}
        run: |
          VERSION="${NODE_VERSION_INPUT}"
          if [ -z "${VERSION}" ] && git -C "${BASE_DIR:-.}" ls-files -- \
              '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.mts' '*.cts' \
              '*.vue' '*.css' '*.scss' '*.sass' '*.less' | grep -q .; then
            VERSION="lts/*"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Node.js for analysis: ${VERSION:-<none — no JS/TS/CSS detected>}"

      - name: Set up Node.js ${{ steps.node.outputs.version }}
        if: steps.node.outputs.version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          # This workflow never runs `npm ci`/`npm install` (the SonarCloud scanner
          # only needs a Node runtime; coverage is passed in via a report path), so
          # dependency caching gives no benefit. setup-node v5+ AUTO-enables npm
          # caching when package.json has a `packageManager` field — that requires a
          # lockfile and would hard-fail repos without one ("Dependencies lock file is
          # not found"), so disable the automatic cache explicitly.
          package-manager-cache: false

      - name: Set up Java ${{ inputs.java-version }}
        if: inputs.java-version != ''
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      # ── 2b. Download coverage report(s) from an earlier job ──────────────
      # This workflow does NOT run your tests — coverage must be produced by an
      # earlier job in the same run and uploaded as an artifact. We download it
      # into the workspace root so the report paths resolve at scan time.
      # continue-on-error: a missing artifact should not mask the scan — the scan
      # still runs and the Quality Gate reports the (low/zero) coverage clearly.
      - name: Download coverage artifact (${{ inputs.coverage-artifact }})
        if: inputs.coverage-artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.coverage-artifact }}
          path: .

      # ── 3. Build Dynamic Sonar Properties ───────────────────────────────
      # If the repo already has a sonar-project.properties file, Sonar will
      # merge these extra args with it. If not, these args define the project.
      # Inputs are passed via env (never pasted into the script) so their
      # contents cannot run as shell code.
      - name: Resolve SonarCloud scan properties
        id: sonar-props
        shell: bash
        env:
          NODE_FOR_SONAR:     ${{ steps.node.outputs.version }}
          PROJECT_KEY:        ${{ inputs.project-key }}
          SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
          PROJECT_NAME:       ${{ inputs.project-name }}
          SOURCES:            ${{ inputs.sources }}
          EXCLUSIONS:         ${{ inputs.exclusions }}
          PY_COVERAGE_REPORT: ${{ inputs.python-coverage-report }}
          JS_COVERAGE_REPORT: ${{ inputs.js-coverage-report }}
          SONAR_EXTRA_ARGS:   ${{ inputs.sonar-extra-args }}
        run: |
          # EXTRA_ARGS is written to $GITHUB_OUTPUT as ONE key=value line, so a
          # newline/CR in any input could inject extra output keys. Reject those.
          # Trailing newlines (e.g. from a YAML `>` or `|` block scalar) are
          # trimmed first, so callers that used block scalars keep working.
          trim_trailing_newlines() {  # $1 = variable name
            local v="${!1}"
            while [[ "$v" == *$'\n' || "$v" == *$'\r' ]]; do v="${v%?}"; done
            printf -v "$1" '%s' "$v"
          }
          for var in PROJECT_KEY SONAR_ORGANIZATION PROJECT_NAME SOURCES EXCLUSIONS \
                     PY_COVERAGE_REPORT JS_COVERAGE_REPORT SONAR_EXTRA_ARGS; do
            trim_trailing_newlines "$var"
          done
          require_single_line() {  # $1 = input name, $2 = value
            case "$2" in
              *$'\n'* | *$'\r'*)
                echo "::error::Input '$1' must not contain a newline or carriage return."
                exit 1
                ;;
            esac
          }
          require_single_line project-key            "${PROJECT_KEY}"
          require_single_line sonar-organization     "${SONAR_ORGANIZATION}"
          require_single_line project-name           "${PROJECT_NAME}"
          require_single_line sources                "${SOURCES}"
          require_single_line exclusions             "${EXCLUSIONS}"
          require_single_line python-coverage-report "${PY_COVERAGE_REPORT}"
          require_single_line js-coverage-report     "${JS_COVERAGE_REPORT}"
          require_single_line sonar-extra-args       "${SONAR_EXTRA_ARGS}"

          EXTRA_ARGS=""

          # JRE auto-provisioning is intentionally LEFT ENABLED: the scanner downloads
          # a SonarQube-Cloud-supported JRE at bootstrap, so the Java version stays
          # current automatically (Java 17 scanner support ends July 2026). Do NOT add
          # -Dsonar.scanner.skipJreProvisioning=true — that falls back to the runner's
          # default Java and can re-trigger the "upgrade to Java 21" deprecation warning.
          # NOTE: auto-provisioning calls api.sonarcloud.io; SonarCloud returns HTTP 403
          # on those calls when the project has "Automatic Analysis" enabled. Disable it
          # (Project → Administration → Analysis Method) and use CI-based analysis.

          # Project key & org are always injected (can be overridden by
          # sonar-project.properties in the calling repo).
          EXTRA_ARGS+="-Dsonar.projectKey=${PROJECT_KEY} "
          EXTRA_ARGS+="-Dsonar.organization=${SONAR_ORGANIZATION} "

          # sonarqube-scan-action splits `args` with string-argv: quotes INSIDE a token
          # are kept literally, so wrap the whole token to allow spaces in the name.
          if [ -n "${PROJECT_NAME}" ]; then
            EXTRA_ARGS+="\"-Dsonar.projectName=${PROJECT_NAME}\" "
          fi

          # Monorepo base dir (sonar.projectBaseDir) is passed via the scan action's
          # `projectBaseDir` input (step 4) — sources/exclusions/coverage paths below
          # are interpreted relative to it. Defaults to the repo root.

          EXTRA_ARGS+="-Dsonar.sources=${SOURCES} "
          EXTRA_ARGS+="-Dsonar.exclusions=${EXCLUSIONS} "

          if [ -n "${PY_COVERAGE_REPORT}" ]; then
            EXTRA_ARGS+="-Dsonar.python.coverage.reportPaths=${PY_COVERAGE_REPORT} "
          fi

          if [ -n "${JS_COVERAGE_REPORT}" ]; then
            EXTRA_ARGS+="-Dsonar.javascript.lcov.reportPaths=${JS_COVERAGE_REPORT} "
          fi

          # Point the JS/TS analyzer at the runner's Node explicitly when it is a
          # supported version (>= 22.12); otherwise leave it unset so the analyzer
          # uses its embedded Node runtime. Added before sonar-extra-args so a caller
          # can still override it there.
          if [ -n "${NODE_FOR_SONAR}" ] && command -v node >/dev/null 2>&1; then
            if node -e 'const [M,m]=process.versions.node.split(".").map(Number); process.exit(M>22||(M===22&&m>=12)?0:1)'; then
              EXTRA_ARGS+="-Dsonar.nodejs.executable=$(command -v node) "
            else
              echo "::warning::Node.js $(node --version) is below the analyzer minimum (22.12); using the scanner's embedded Node.js runtime instead."
            fi
          fi

          # Language-agnostic passthrough for any other coverage / scanner props.
          # Appended as raw text; the scan action splits it into tokens (step 4).
          if [ -n "${SONAR_EXTRA_ARGS}" ]; then
            EXTRA_ARGS+="${SONAR_EXTRA_ARGS} "
          fi

          echo "extra_args=${EXTRA_ARGS}" >> "$GITHUB_OUTPUT"

      # ── 4. SonarCloud Scan ───────────────────────────────────────────────
      # sonarqube-scan-action replaces the archived, Docker-based
      # sonarcloud-github-action. It runs the scanner directly on the runner, so
      # the Node.js set up above is visible to the JS/TS analyzer.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ${{ inputs.base-dir != '' && inputs.base-dir || '.' }}
          args: ${{ steps.sonar-props.outputs.extra_args }}

      # ── 5. Quality Gate Check ────────────────────────────────────────────
      # The scanner writes report-task.txt under <projectBaseDir>/.scannerwork.
      # For a monorepo sub-project (base-dir set) that is NOT the repo-root
      # default the Quality Gate action assumes — point it at the right path,
      # otherwise it fails with ".scannerwork/report-task.txt does not exist".
      - name: SonarCloud Quality Gate check
        if: inputs.fail-on-quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: ${{ inputs.base-dir != '' && format('{0}/.scannerwork/report-task.txt', inputs.base-dir) || '.scannerwork/report-task.txt' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
