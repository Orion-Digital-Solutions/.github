name: License Compliance (Reusable)

# Reusable workflow — scans dependencies for OSS license compliance using Trivy.
#
# Caller usage (no secrets needed; the calling job must grant at least these):
#   permissions:
#     contents: read
#     security-events: write
#     actions: read
#   uses: orion-digital-solutions/.github/.github/workflows/license-compliance.yml@v1
#   with:
#     forbidden-licenses: "GPL-2.0,GPL-3.0,AGPL-3.0"
#     install-command: "npm ci --omit=dev --ignore-scripts"
#
# ── Where Trivy reads licences from (fs scan) ────────────────────────────────
# Lock files alone only carry licences for npm (package-lock.json). For the
# others, Trivy reads licences from installed packages, so set install-command
# to something that leaves them where Trivy looks:
# • pip (requirements.txt): the site-packages of $VIRTUAL_ENV, else of the
#   `python3` on PATH. The runner's system Python has no site-packages dir, so
#   install into a venv and export VIRTUAL_ENV through $GITHUB_ENV:
#     python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -r requirements.txt && echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
#   Pipenv, Poetry and uv lock files get no licence data from Trivy at all.
# • pnpm: node_modules next to pnpm-lock.yaml, inside scan-path:
#     corepack enable && pnpm install --frozen-lockfile --prod --ignore-scripts
# • Yarn Classic: node_modules next to yarn.lock, inside scan-path:
#     yarn install --frozen-lockfile --production --ignore-scripts
# • Yarn 2+: .yarn/cache (or .yarn/unplugged) next to yarn.lock; Yarn 4 uses a
#   global cache by default, so turn it off:
#     corepack enable && YARN_ENABLE_GLOBAL_CACHE=false yarn install --immutable
# • Go: vendor/ next to go.mod, or the module cache at $GOPATH/pkg/mod
#   (default ~/go/pkg/mod; a custom GOMODCACHE is not read):
#     go mod download
# The command runs from the repository root; prefix `cd <dir> &&` for a
# project in a subdirectory.
#
# ── Why this matters ──────────────────────────────────────────────────────────
# As a consulting firm delivering software to enterprise clients, GPL/AGPL
# licenses in transitive dependencies can create contractual and IP obligations.
#
# ── Artifacts ────────────────────────────────────────────────────────────────
# Uploads `license-report` artifact (JSON) for the CI orchestrator report job.
# Also uploads SARIF to the GitHub Security tab (Code Scanning).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      # Empty means the default list. The default lives in ONE place: the
      # DEFAULT_FORBIDDEN_LICENSES env on the license-check job below. (The
      # orchestrator always passes this input, as "" when its caller doesn't.)
      forbidden-licenses:
        description: "Comma-separated SPDX license IDs to treat as violations. Leave blank for the default list (DEFAULT_FORBIDDEN_LICENSES in this workflow)."
        required: false
        type: string
        default: ""

      allowed-licenses:
        description: "Comma-separated SPDX license IDs that are explicitly permitted"
        required: false
        type: string
        default: "MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,CC0-1.0,Unlicense,Python-2.0,PSF-2.0"

      scan-path:
        description: "Directory to scan for dependency manifests"
        required: false
        type: string
        default: "."

      severity:
        description: "Minimum severity to report: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
        required: false
        type: string
        default: "HIGH,CRITICAL"

      # See "Where Trivy reads licences from" at the top for what the command
      # must leave behind for each ecosystem.
      install-command:
        description: "Command that installs production dependencies before the scan, so Trivy can read licences that lock files don't carry (pip, pnpm, Yarn, Go). Runs from the repository root. Leave blank to scan lock files only."
        required: false
        type: string
        default: ""

      upload-sarif:
        description: "Upload SARIF results to GitHub Security tab"
        required: false
        type: boolean
        default: true

      runner:
        description: "GitHub Actions runner label"
        required: false
        type: string
        default: "ubuntu-latest"

# Default for any job without its own block: read-only.
permissions:
  contents: read

jobs:
  license-check:
    name: OSS License Compliance
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    # security-events: write to upload SARIF to code scanning; actions: read
    # lets upload-sarif read workflow run metadata (needed on private repos).
    permissions:
      contents: read
      security-events: write
      actions: read
    # Single source of the default forbidden list, used when the
    # forbidden-licenses input is blank.
    env:
      DEFAULT_FORBIDDEN_LICENSES: "GPL-2.0,GPL-3.0,AGPL-1.0,AGPL-3.0,LGPL-2.0,LGPL-2.1,LGPL-3.0,EUPL-1.1,EUPL-1.2,CCDL-1.0,OSL-3.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ── Optional: install dependencies so Trivy can read their licences ──
      # Without this, pip/pnpm/Yarn/Go packages are listed with no licence
      # and cannot match the forbidden list. A failing command fails the job.
      - name: Install production dependencies
        shell: bash
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          if [ -z "${INSTALL_COMMAND//[[:space:]]/}" ]; then
            echo "::warning::No install-command set: licences for pip, pnpm, Yarn and Go dependencies cannot be read from lock files alone, so the licence gate may pass without checking them. Set install-command to install production dependencies before the scan."
            exit 0
          fi
          bash -c "${INSTALL_COMMAND}"

      # ── Build Trivy config from inputs ───────────────────────────────────
      # Lists are split on commas (or newlines), trimmed, and blank entries
      # dropped. A blank forbidden list falls back to the default; a blank
      # allowed list writes no `ignored:` key. jq writes the config as JSON,
      # which is valid YAML and quotes every entry safely.
      - name: Prepare Trivy license config
        id: license-config
        shell: bash
        env:
          FORBIDDEN: ${{ inputs.forbidden-licenses }}
          ALLOWED:   ${{ inputs.allowed-licenses }}
        run: |
          jq -n \
            --arg forbidden "$FORBIDDEN" \
            --arg default "$DEFAULT_FORBIDDEN_LICENSES" \
            --arg allowed "$ALLOWED" \
            'def list: [splits("[,\n]") | sub("^[[:space:]]+"; "") | sub("[[:space:]]+$"; "") | select(length > 0)];
             ($forbidden | list) as $f
             | ($allowed | list) as $a
             | {license: (
                 {forbidden: (if ($f | length) > 0 then $f else ($default | list) end)}
                 + (if ($a | length) > 0 then {ignored: $a} else {} end)
               )}' > trivy-license.yaml

          EFFECTIVE=$(jq -r '.license.forbidden | join(",")' trivy-license.yaml)
          echo "Forbidden licences: ${EFFECTIVE}"
          echo "forbidden=${EFFECTIVE}" >> "$GITHUB_OUTPUT"
          echo "config_path=trivy-license.yaml" >> "$GITHUB_OUTPUT"

      # ── Scan 1: Table (job log summary) — fails on violations ────────────
      - name: Trivy license scan — table (fail on violations)
        id: trivy-table
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type:    fs
          scan-ref:     ${{ inputs.scan-path }}
          scanners:     license
          severity:     ${{ inputs.severity }}
          trivy-config: ${{ steps.license-config.outputs.config_path }}
          format:       table
          exit-code:    "1"

      # ── Scan 2: JSON (artifact for report) ───────────────────────────────
      - name: Trivy license scan — JSON (report artifact)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type:    fs
          scan-ref:     ${{ inputs.scan-path }}
          scanners:     license
          severity:     ${{ inputs.severity }}
          trivy-config: ${{ steps.license-config.outputs.config_path }}
          format:       json
          output:       trivy-license-raw.json
          exit-code:    "0"

      # ── Enrich JSON with metadata ─────────────────────────────────────────
      - name: Enrich license report with metadata
        if: always()
        shell: bash
        env:
          # The effective list (default applied, entries trimmed), not the raw input.
          FORBIDDEN: ${{ steps.license-config.outputs.forbidden }}
          SEVERITY:  ${{ inputs.severity }}
        run: |
          RAW_FILE="trivy-license-raw.json"
          [ -f "$RAW_FILE" ] || echo '{"Results":[]}' > "$RAW_FILE"

          # Count total packages and violations
          TOTAL_PKGS=$(jq '[.Results[].Licenses // [] | length] | add // 0' "$RAW_FILE" 2>/dev/null || echo "0")
          VIOLATIONS=$(jq '[.Results[].Licenses // [] | .[] | select(.Category == "forbidden")] | length' "$RAW_FILE" 2>/dev/null || echo "0")

          # Read the raw report via --slurpfile (from the file path) rather than
          # --argjson "$(cat ...)" — inlining a large report into jq's argv blows
          # past the kernel ARG_MAX limit ("Argument list too long"). slurpfile
          # wraps the file's single object in an array, hence $raw[0].
          jq -n \
            --slurpfile raw "$RAW_FILE" \
            --arg forbidden "$FORBIDDEN" \
            --arg severity "$SEVERITY" \
            --argjson total_packages "$TOTAL_PKGS" \
            --argjson violation_count "$VIOLATIONS" \
            '{
              meta: {
                forbidden_licenses: ($forbidden | split(",") | map(select(length > 0))),
                severity_filter: $severity,
                total_packages: $total_packages,
                violation_count: $violation_count
              },
              results: $raw[0].Results
            }' > license-report.json

      # ── Upload JSON report artifact ───────────────────────────────────────
      - name: Upload license report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report
          path: license-report.json
          retention-days: 7
          if-no-files-found: warn

      # ── Preflight: verify code scanning availability before SARIF upload ───
      - name: Check code scanning availability
        id: code-scanning-preflight
        if: inputs.upload-sarif && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL:  ${{ github.api_url }}
          REPO:     ${{ github.repository }}
        run: |
          set +e
          HTTP_CODE=$(curl -sS -o cs-preflight.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}/repos/${REPO}/code-scanning/alerts?per_page=1")
          CURL_EXIT=$?
          set -e

          if [ "${CURL_EXIT}" -ne 0 ]; then
            echo "::warning::SARIF upload skipped: unable to reach GitHub code-scanning API."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${HTTP_CODE}" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MESSAGE=$(jq -r '.message // empty' cs-preflight.json 2>/dev/null || true)
          if [ -n "${MESSAGE}" ]; then
            echo "::warning::SARIF upload skipped: ${MESSAGE} (HTTP ${HTTP_CODE})."
          else
            echo "::warning::SARIF upload skipped: code scanning unavailable (HTTP ${HTTP_CODE})."
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"

      # ── Scan 3: SARIF (GitHub Security tab) ──────────────────────────────
      # SARIF is supplementary; it must never fail the job. The verdict
      # comes from the table scan above.
      - name: Trivy license scan — SARIF (Security tab)
        if: inputs.upload-sarif && !cancelled() && steps.code-scanning-preflight.outputs.available == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type:    fs
          scan-ref:     ${{ inputs.scan-path }}
          scanners:     license
          severity:     ${{ inputs.severity }}
          trivy-config: ${{ steps.license-config.outputs.config_path }}
          format:       sarif
          output:       trivy-license.sarif
          exit-code:    "0"

      - name: Upload SARIF to GitHub Security tab
        if: inputs.upload-sarif && !cancelled() && steps.code-scanning-preflight.outputs.available == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-license.sarif
          category:   license-compliance

      # ── Fail the job if violations were found ────────────────────────────
      - name: Fail if license violations detected
        if: steps.trivy-table.outcome == 'failure'
        shell: bash
        run: |
          COUNT=$(jq '.meta.violation_count' license-report.json 2>/dev/null || echo "unknown")
          echo "::error::${COUNT} license violation(s) detected. Review the 'license-report' artifact for details."
          exit 1
