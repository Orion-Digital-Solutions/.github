name: OpenSSF Scorecard

# Roadmap item 7.4: supply-chain posture of THIS repository (the shared
# workflows every Orion repo runs). Results go to the Security tab and the
# public OpenSSF Scorecard API (badge). Not a reusable workflow.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"   # weekly, Monday 04:30 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read          # read workflow runs (CI-Tests, Dangerous-Workflow checks)
      security-events: write # upload SARIF to the Security tab
      id-token: write        # sign results published to the OpenSSF API
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
