name: Orion CI Orchestrator (Reusable)

# Central CI orchestrator — single source of truth for all quality, security,
# and release workflows across every Orion Digital Solutions repository.
# v2 job graph: docs/v2-design.md sections 5 to 10 (ROADMAP 6.2 to 6.9).
#
# ── Caller usage (add ONE file to each project repo) ─────────────────────────
#
#   jobs:
#     ci:
#       name: Orion CI             # part of the required check name: keep it
#       uses: orion-digital-solutions/.github/.github/workflows/ci.yml@v2
#       permissions:               # union of what the jobs below request
#         contents: write          # release-please, SBOM / container SBOM release assets
#         pull-requests: write     # release-please Release PR
#         security-events: write   # SARIF upload (secret, dependency, licence, Docker lint, image scan)
#         actions: read            # SARIF upload on private repos
#         id-token: write          # SBOM attestation (sbom.yml)
#         attestations: write      # SBOM attestation (sbom.yml)
#       with:
#         sonar-project-key: orion-digital-solutions_my-repo
#       secrets:
#         SONAR_TOKEN:           ${{ secrets.SONAR_TOKEN }}
#         SONAR_ISSUE_RETRIEVAL: ${{ secrets.SONAR_ISSUE_RETRIEVAL }}
#         GITLEAKS_LICENSE:      ${{ secrets.GITLEAKS_LICENSE }}
#         AZURE_NPM_TOKEN:       ${{ secrets.AZURE_NPM_TOKEN }}
#
#   Monorepo (multiple Sonar projects / Dockerfiles in one repo): pass the list
#   inputs `sonar-projects` and/or `docker-targets` instead of the scalars.
#
# ── The one required check ────────────────────────────────────────────────────
#   Require ONLY `Orion CI / CI gate` in branch protection. It always runs and
#   fails when any job failed or was cancelled. Every other check name may
#   change between minor versions; per-project and per-Dockerfile checks are
#   skipped on runs that do not need them, so never require them.
#
# ── Job graph ─────────────────────────────────────────────────────────────────
#   fast-checks  "Fast checks": checkout → plan (normalise inputs, event
#                gating, Sonar change detection, docs-only detection) →
#                secret scan → dependency CVE scan → licence scan
#                (install-command, the only caller code, runs last) → fail if
#                any scan is not clean.
#                Every decision about WHAT runs is made here and exported as
#                lists + counts; downstream `if:`s read only the counts.
#   sonarcloud   matrix over the plan's (filtered) Sonar projects
#   docker-lint  "Dockerfile lint": ONE job lints every Dockerfile
#   image        opt-in (docker-build-image): build + Trivy/Grype + SBOM +
#                Dive, matrix per Dockerfile, read-only token
#   image-publish  release only: attaches the container SBOMs to the release
#                (contents: write, runs no repository code)
#   release-please (disabled), sbom (push to main / release)
#   gate         "CI gate": always runs; consolidated report + verdict
#
#   Downstream jobs use `!cancelled()`, so a secret finding in fast-checks
#   does not hide the Sonar and lint results.
#
# ── What runs and when ────────────────────────────────────────────────────────
#   pull_request        secret (PR delta) + dependency CVEs + licence; Sonar on CHANGED projects
#                       only; Docker lint; image if docker-build-image
#   push, main branch   secret (push delta) + dependency CVEs + licence; Sonar all; Docker lint;
#                       image if enabled; SBOM. Never docs-only.
#   push, other branch  as main, without SBOM; docs-only applies
#   schedule            full-history secret scan + dependency CVEs + licence; image CVE scan only
#                       if enabled. No Sonar, no Docker lint.
#   release             SBOM; image build + SBOM publish if enabled (fast-checks
#                       then runs the plan only). No secret/dependency/licence/Sonar/lint.
#   Docs-only change (PR / non-main push, every changed path matches
#   docs-only-paths): secret, dependency and licence scans still run; Sonar,
#   lint, image skipped.
#
#   Child workflows and actions are referenced with the self-repository prefix
#   `$/`, which resolves to THIS repository at the running commit, so a caller
#   pinned to a tag or SHA gets the orchestrator and all its parts from one
#   commit (docs/v2-design.md section 1).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      sonar-project-key:
        description: "SonarCloud project key (orion-digital-solutions_<repo>) for a SINGLE-project repo. Leave blank to skip, or when using sonar-projects (monorepo)."
        required: false
        type: string
        default: ""

      sonar-sources:
        description: "Source directory to analyse for the SINGLE-project path (sonar-project-key). Defaults to the repo root. Ignored when sonar-projects is set."
        required: false
        type: string
        default: "."

      # ── Monorepo: multiple SonarCloud projects bound to one repo ──────────────
      # JSON array — one element per sub-project, each its own SonarCloud project
      # (own key, own Quality Gate, own PR decoration). Mutually exclusive with the
      # scalar sonar-project-key above. Each element:
      #   { "key": "...", "base-dir": "apps/web",        # required: key; base-dir for monorepo
      #     "sources": "src",                            # relative to base-dir when set
      #     "paths": ["packages/shared/*"],              # optional, v2: extra change triggers
      #     "project-name": "...",                       # optional, all below optional
      #     "node-version": "20", "python-version": "3.12", "java-version": "17",
      #     "js-coverage-report": "coverage/lcov.info",  # relative to base-dir
      #     "python-coverage-report": "coverage.xml",
      #     "coverage-artifact": "web-cov", "sonar-extra-args": "-Dsonar.x=y" }
      # Set "base-dir" to the sub-project's directory so coverage report paths
      # (which tools emit relative to that dir) resolve — otherwise SonarCloud
      # looks for them at the repo root and reports 0% coverage. With base-dir
      # set, sources/exclusions/coverage paths are interpreted RELATIVE to it.
      # On pull requests only the AFFECTED projects are scanned: a changed path
      # under base-dir, or matching one of "paths" (bash `case` globs; `*` also
      # matches `/`); a blank or "." base-dir, or a change to .github/workflows/*
      # or the root sonar-project.properties, makes every project affected.
      # Every other event scans all projects.
      sonar-projects:
        description: "JSON array of monorepo sub-projects (see ci.yml comments). Mutually exclusive with sonar-project-key. Leave blank for the single-project path."
        required: false
        type: string
        default: ""

      sonar-python-coverage-report:
        description: "Path to Python XML coverage report (e.g. coverage.xml)"
        required: false
        type: string
        default: ""

      sonar-js-coverage-report:
        description: "Path to JS/TS LCOV coverage report (e.g. coverage/lcov.info)"
        required: false
        type: string
        default: ""

      # ── SonarCloud coverage import ────────────────────────────────────────────
      # SonarCloud's Quality Gate requires coverage on new code. This orchestrator
      # does NOT run your tests — produce coverage in an EARLIER job in the same run,
      # upload it as an artifact, then name that artifact here and point the
      # report-path inputs above at the files inside it. See the caller template.
      sonar-coverage-artifact:
        description: "Name of the artifact (from an earlier job) holding coverage report(s) to import into the SonarCloud scan."
        required: false
        type: string
        default: ""

      sonar-extra-args:
        description: "Extra raw -Dsonar.* properties for the scan (e.g. coverage report paths for languages without a dedicated input)."
        required: false
        type: string
        default: ""

      python-version:
        description: "Python version to set up (e.g. '3.11'). Leave blank to skip."
        required: false
        type: string
        default: ""

      node-version:
        description: "Node.js version to set up (e.g. '20'). Leave blank to skip."
        required: false
        type: string
        default: ""

      java-version:
        description: "Java version to set up (e.g. '17'). Leave blank to skip."
        required: false
        type: string
        default: ""

      release-type:
        description: "Release Please release type for a SINGLE-package repo (python, node, java, maven, gradle, dotnet, go, simple, ...). Leave blank to skip, or when using release-manifest."
        required: false
        type: string
        default: ""

      release-manifest:
        description: "Use Release Please manifest mode for a monorepo with independently versioned packages. Reads release-please-config.json + .release-please-manifest.json at the repo root. Mutually exclusive with release-type."
        required: false
        type: boolean
        default: false

      release-app-id:
        description: "App ID of the GitHub App used to mint the Release Please token (with the RELEASE_APP_PRIVATE_KEY secret), so its PRs and releases trigger other workflows. Leave blank to use GITHUB_TOKEN."
        required: false
        type: string
        default: ""

      main-branch:
        description: "Name of the default/main branch"
        required: false
        type: string
        default: "main"

      forbidden-licenses:
        description: "Comma-separated SPDX license IDs to treat as violations. Leave blank for the org default list."
        required: false
        type: string
        default: ""

      license-install-command:
        description: "Command that installs production dependencies before the licence scan, so Trivy can read licences that lock files don't carry (pip, pnpm, Yarn, Go). Leave blank to scan lock files only."
        required: false
        type: string
        default: ""

      secret-scan-full-history:
        description: "Force a full git history secret scan (always on for schedule events)"
        required: false
        type: boolean
        default: false

      # ── Dependency vulnerability scan (v2, ROADMAP 7.1) ───────────────────────
      # Trivy filesystem scan of lock files/manifests for known CVEs, in Fast
      # checks, on every event but release. Vulnerabilities with no fixed
      # version are ignored; accept a CVE in .trivyignore at the repository
      # root (on PRs the base branch copy is used). A finding fails CI.
      dependency-scan:
        description: "Scan dependency lock files for known vulnerabilities (Trivy fs). A finding at dependency-scan-severity fails CI. Accept a CVE in .trivyignore."
        required: false
        type: boolean
        default: true

      dependency-scan-severity:
        description: "Comma-separated severities that fail the dependency scan (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)"
        required: false
        type: string
        default: "CRITICAL,HIGH"

      # ── Docs-only skip (v2) ───────────────────────────────────────────────────
      # On pull requests and on pushes to branches other than main-branch, when
      # EVERY changed path matches one of these patterns, Sonar, Docker lint and
      # the image jobs are skipped (secret and licence scans still run). One bash
      # `case` pattern per line; `*` also matches `/`, so `*.md` matches
      # `docs/a/b.md`. Not `*.txt` (requirements.txt). Blank disables the skip.
      docs-only-paths:
        description: "Newline-separated path patterns (bash `case` globs, `*` matches `/`) that count as documentation. When every changed path matches, Sonar, Docker lint and image jobs are skipped on PRs and non-main pushes. Blank disables the skip."
        required: false
        type: string
        default: |-
          *.md
          *.mdx
          *.rst
          docs/*
          LICENSE
          LICENSE.*
          .github/ISSUE_TEMPLATE/*
          .github/PULL_REQUEST_TEMPLATE*
          CODEOWNERS

      runner:
        description: "GitHub Actions runner label (self-hosted runners must be on runner 2.336.0 or newer)"
        required: false
        type: string
        default: "ubuntu-latest"

      # ── Docker best-practices pipeline ────────────────────────────────────────
      # The orchestrator auto-detects every Dockerfile in the repo (minus the
      # built-in non-production excludes and docker-exclude). Set dockerfile to
      # an explicit path, or docker-targets to an explicit list, to override.
      dockerfile:
        description: "Path to the Dockerfile to scan (e.g. apps/api/Dockerfile). Leave blank to auto-detect."
        required: false
        type: string
        default: ""

      docker-context:
        description: "Docker build context for `dockerfile`, or for the Dockerfile auto-detection finds when it finds exactly one (ignored with a warning when it finds several — use docker-targets). Leave blank to use the Dockerfile's directory (repo root for a root Dockerfile)."
        required: false
        type: string
        default: ""

      # ── Monorepo: explicitly list the Dockerfiles to lint/scan ────────────────
      # JSON array — one element per image. Mutually exclusive with the scalar
      # `dockerfile` input. Each element:
      #   { "dockerfile": "apps/api/Dockerfile",   # required
      #     "context": "apps/api",                  # optional (default: Dockerfile's dir)
      #     "image-name": "api:ci" }                # optional (default: per-target)
      docker-targets:
        description: "JSON array of Dockerfile targets (see ci.yml comments). Mutually exclusive with `dockerfile`. Leave blank to auto-detect all Dockerfiles."
        required: false
        type: string
        default: ""

      docker-exclude:
        description: "Extra path globs to prune from Dockerfile auto-detection (comma- or space-separated), on top of the built-in non-production excludes (examples, test, tests, fixtures, docs, node_modules, vendor, .git)."
        required: false
        type: string
        default: ""

      docker-image-name:
        description: "Name and tag for the CI image (e.g. myapp:ci) of `dockerfile`, or of the Dockerfile auto-detection finds when it finds exactly one (ignored with a warning when it finds several — use docker-targets). Defaults to 'orion-docker-check-<target-id>:ci'."
        required: false
        type: string
        default: ""

      docker-trivy-severity:
        description: "CVE severity levels that fail the Docker vulnerability scan"
        required: false
        type: string
        default: "CRITICAL,HIGH"

      docker-trivy-ignore-unfixed:
        description: "Skip CVEs with no fix available (suppresses base image noise where upstream has not patched yet)"
        required: false
        type: boolean
        default: false

      docker-dive-enable:
        description: "Run Dive image efficiency check in the image job (not on schedule events)"
        required: false
        type: boolean
        default: true

      docker-dive-min-efficiency:
        description: "Minimum Dive image efficiency score (0.0–1.0)"
        required: false
        type: number
        default: 0.9

      docker-grype-enable:
        description: "Run Grype as a second vulnerability scanner alongside Trivy in the image job"
        required: false
        type: boolean
        default: false

      docker-build-image:
        description: "Build the image in CI and run the image job (CVE scan, container SBOM, Dive; on schedule the CVE scan only; on release the SBOMs are attached). Default false — CI lints the Dockerfile only (Hadolint + Checkov) and the image is built/scanned in your CD pipeline."
        required: false
        type: boolean
        default: false

    outputs:
      release-created:
        description: "true if a new GitHub Release was created"
        value: ${{ jobs.release-please.outputs.release-created }}
      release-tag:
        description: "Git tag of the new release (e.g. v1.4.0)"
        value: ${{ jobs.release-please.outputs.tag-name }}
      release-version:
        description: "Version string of the new release (e.g. 1.4.0). Empty in manifest mode."
        value: ${{ jobs.release-please.outputs.version }}
      release-paths:
        description: "JSON array of package paths released this run (manifest mode; empty otherwise)"
        value: ${{ jobs.release-please.outputs.paths-released }}

    secrets:
      SONAR_TOKEN:
        description: "SonarCloud token for the SonarCloud scan job (analysis + Quality Gate)"
        required: false
      SONAR_ISSUE_RETRIEVAL:
        description: "SonarCloud token for the CI gate report only — read-only Web API (Quality Gate, measures, issues, hotspots)"
        required: false
      GITLEAKS_LICENSE:
        description: "Gitleaks Pro license key (optional)"
        required: false
      AZURE_NPM_TOKEN:
        description: "Read-only npm registry token mounted as a BuildKit secret when docker-build-image is true"
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: "Private key of the GitHub App named by release-app-id (mints the Release Please token)"
        required: false

# Least privilege by default: every job reads only. Jobs raise this to exactly
# what they (or the reusable workflow they call) need.
permissions:
  contents: read

jobs:

  # ── Fast checks: plan + secret, dependency and licence scans (6.3, 7.1) ────
  # One job, one billed minute. Step order matters: the plan, the secret scan
  # and the dependency scan record their outputs BEFORE the licence scan runs
  # install-command (the only caller code), and a later step cannot change an
  # earlier step's outputs, so the gate can trust plan counts and the secret
  # and dependency verdicts.
  fast-checks:
    name: Fast checks
    # On release only the plan is needed, and only for the image path.
    if: github.event_name != 'release' || inputs.docker-build-image
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30          # a scheduled full-history scan of a large repo
    permissions:
      contents: read           # checkout
      security-events: write   # secret, dependency and licence SARIF upload
      actions: read            # SARIF upload reads workflow run metadata (private repos)
    outputs:
      sonar-projects: ${{ steps.plan.outputs.sonar-projects }}
      sonar-count:    ${{ steps.plan.outputs.sonar-count }}
      sonar-total:    ${{ steps.plan.outputs.sonar-total }}
      docker-targets: ${{ steps.plan.outputs.docker-targets }}
      docker-count:   ${{ steps.plan.outputs.docker-count }}
      lint-targets:   ${{ steps.plan.outputs.lint-targets }}
      lint-count:     ${{ steps.plan.outputs.lint-count }}
      image-targets:  ${{ steps.plan.outputs.image-targets }}
      image-count:    ${{ steps.plan.outputs.image-count }}
      docs-only:      ${{ steps.plan.outputs.docs-only }}
      plan-outcome:   ${{ steps.plan.outcome }}
      secret-result:  ${{ steps.secret.outputs.result }}
      licence-result: ${{ steps.licence.outputs.result }}
      dependency-result: ${{ steps.dependency.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # secret-scan ranges, change detection
          persist-credentials: false

      # ── Plan ────────────────────────────────────────────────────────────
      # 1. Normalise the scalar inputs OR the list inputs into two JSON arrays
      #    (Sonar projects, Docker targets). FAILS LOUDLY on a caller error
      #    (ambiguous scalar+list, or malformed JSON).
      # 2. Changed files: PR → merge commit vs its first parent; push to a
      #    non-main branch → github.event.before..HEAD. Unknown (no merge
      #    commit, new branch, force-push) → treated as "everything changed".
      # 3. Docs-only (PR, non-main push): every changed path matches
      #    docs-only-paths.
      # 4. Sonar change detection (PR only): keep the affected projects.
      # 5. Event gating: schedule/release → no Sonar, no lint; image only when
      #    docker-build-image; docs-only → no Sonar, lint or image.
      - name: Plan
        id: plan
        shell: bash
        env:
          SONAR_KEY:       ${{ inputs.sonar-project-key }}
          SONAR_SOURCES:   ${{ inputs.sonar-sources }}
          SONAR_PROJECTS:  ${{ inputs.sonar-projects }}
          SONAR_PY_COV:    ${{ inputs.sonar-python-coverage-report }}
          SONAR_JS_COV:    ${{ inputs.sonar-js-coverage-report }}
          SONAR_COV_ART:   ${{ inputs.sonar-coverage-artifact }}
          SONAR_EXTRA:     ${{ inputs.sonar-extra-args }}
          PY_VERSION:      ${{ inputs.python-version }}
          NODE_VERSION:    ${{ inputs.node-version }}
          JAVA_VERSION:    ${{ inputs.java-version }}
          DOCKER_TARGETS:  ${{ inputs.docker-targets }}
          DOCKERFILE:      ${{ inputs.dockerfile }}
          DOCKER_CONTEXT:  ${{ inputs.docker-context }}
          DOCKER_IMAGE:    ${{ inputs.docker-image-name }}
          DOCKER_EXCLUDE:  ${{ inputs.docker-exclude }}
          DOCS_ONLY_PATHS: ${{ inputs.docs-only-paths }}
          BUILD_IMAGE:     ${{ inputs.docker-build-image }}
          MAIN_BRANCH:     ${{ inputs.main-branch }}
          EVENT:           ${{ github.event_name }}
          REF_NAME:        ${{ github.ref_name }}
          REF_TYPE:        ${{ github.ref_type }}
          BEFORE_SHA:      ${{ github.event.before }}
        run: |
          set -uo pipefail

          # ════════════════════════════════════════════════════════════════════
          # SonarCloud projects → normalised JSON array
          # ════════════════════════════════════════════════════════════════════
          if [ -n "${SONAR_PROJECTS}" ] && [ -n "${SONAR_KEY}" ]; then
            echo "::error::Both 'sonar-project-key' and 'sonar-projects' are set. Pass the scalar key for a single project OR the JSON array for a monorepo — not both."
            exit 1
          fi

          SONAR_JSON='[]'
          if [ -n "${SONAR_PROJECTS}" ]; then
            if ! printf '%s' "${SONAR_PROJECTS}" | jq -e 'type == "array"' >/dev/null 2>&1; then
              echo "::error::'sonar-projects' is not valid JSON (expected an array)."
              exit 1
            fi
            if printf '%s' "${SONAR_PROJECTS}" | jq -e 'length > 0 and any(.[]; (.key // "") == "")' >/dev/null 2>&1; then
              echo "::error::Every element of 'sonar-projects' must have a non-empty \"key\"."
              exit 1
            fi
            if ! printf '%s' "${SONAR_PROJECTS}" | jq -e 'all(.[]; .paths == null or (.paths | type) == "string" or ((.paths | type) == "array" and all(.paths[]; type == "string")))' >/dev/null 2>&1; then
              echo "::error::\"paths\" in 'sonar-projects' must be an array of strings (glob patterns)."
              exit 1
            fi
            # Default 'sources' to the repo root when an element omits it.
            SONAR_JSON=$(printf '%s' "${SONAR_PROJECTS}" | jq -c '[ .[] | .sources = (.sources // ".") ]')
          elif [ -n "${SONAR_KEY}" ]; then
            # Single-project path → synthesize a length-1 list from the scalar inputs.
            SONAR_JSON=$(jq -nc \
              --arg key    "${SONAR_KEY}" \
              --arg src    "${SONAR_SOURCES:-.}" \
              --arg pycov  "${SONAR_PY_COV}" \
              --arg jscov  "${SONAR_JS_COV}" \
              --arg covart "${SONAR_COV_ART}" \
              --arg extra  "${SONAR_EXTRA}" \
              --arg py     "${PY_VERSION}" \
              --arg node   "${NODE_VERSION}" \
              --arg java   "${JAVA_VERSION}" \
              '[{ key: $key, sources: $src,
                  "python-coverage-report": $pycov,
                  "js-coverage-report": $jscov,
                  "coverage-artifact": $covart,
                  "sonar-extra-args": $extra,
                  "python-version": $py,
                  "node-version": $node,
                  "java-version": $java }]')
          fi
          SONAR_TOTAL=$(printf '%s' "${SONAR_JSON}" | jq 'length')
          echo "Configured ${SONAR_TOTAL} SonarCloud project(s):"
          printf '%s' "${SONAR_JSON}" | jq -r '.[] | "  - \(.key)  (base-dir: \(."base-dir" // "."), sources: \(.sources))"' || true

          # ════════════════════════════════════════════════════════════════════
          # Docker targets → normalised JSON array
          # ════════════════════════════════════════════════════════════════════
          if [ -n "${DOCKER_TARGETS}" ] && [ -n "${DOCKERFILE}" ]; then
            echo "::error::Both 'dockerfile' and 'docker-targets' are set. Pass the scalar path for one image OR the JSON array for several — not both."
            exit 1
          fi

          DOCKER_JSON='[]'
          if [ -n "${DOCKER_TARGETS}" ]; then
            # ── Explicit list: lint EXACTLY these (full control) ─────────────
            if ! printf '%s' "${DOCKER_TARGETS}" | jq -e 'type == "array"' >/dev/null 2>&1; then
              echo "::error::'docker-targets' is not valid JSON (expected an array)."
              exit 1
            fi
            if printf '%s' "${DOCKER_TARGETS}" | jq -e 'length > 0 and any(.[]; (.dockerfile // "") == "")' >/dev/null 2>&1; then
              echo "::error::Every element of 'docker-targets' must have a non-empty \"dockerfile\"."
              exit 1
            fi
            # Default context to the Dockerfile's dir; derive target-id slug when absent.
            DOCKER_JSON=$(printf '%s' "${DOCKER_TARGETS}" | jq -c '
              def slug: ascii_downcase | gsub("[^a-z0-9]+"; "-") | gsub("(^-)|(-$)"; "");
              [ .[] | {
                  dockerfile: .dockerfile,
                  context: (.context // (if (.dockerfile | test("/")) then (.dockerfile | sub("/[^/]*$"; "")) else "." end)),
                  "image-name": (."image-name" // ""),
                  "target-id": (."target-id" // (.dockerfile | slug))
              } ]')
          elif [ -n "${DOCKERFILE}" ]; then
            # ── Explicit single Dockerfile (back-compat) ─────────────────────
            if [ -f "${DOCKERFILE}" ]; then
              if   [ -n "${DOCKER_CONTEXT}" ];      then CTX="${DOCKER_CONTEXT}"
              elif [[ "${DOCKERFILE}" == */* ]];    then CTX=$(dirname "${DOCKERFILE}")
              else CTX="."; fi
              TID=$(printf '%s' "${DOCKERFILE}" | tr '[:upper:]' '[:lower:]' | sed -e 's|[^a-z0-9]\+|-|g' -e 's|^-||' -e 's|-$||')
              DOCKER_JSON=$(jq -nc --arg df "${DOCKERFILE}" --arg ctx "${CTX}" --arg img "${DOCKER_IMAGE}" --arg tid "${TID}" \
                '[{dockerfile:$df, context:$ctx, "image-name":$img, "target-id":$tid}]')
            else
              echo "::warning::Dockerfile not found at specified path '${DOCKERFILE}'. Docker pipeline will be skipped."
            fi
          else
            # ── Auto-detect ALL Dockerfiles (safest: full coverage) ──────────
            # Prune vendored/VCS dirs; exclude non-production path segments and
            # any caller docker-exclude globs. Shallowest-first for stable order.
            CANDIDATES=$(find . \
                -type d \( -name node_modules -o -name .git -o -name vendor \) -prune -o \
                -type f \( -iname 'Dockerfile' -o -iname 'Dockerfile.*' \) \
                ! -iname '*.md' ! -iname '*.txt' \
                -printf '%d\t%p\n' \
              | sort -k1,1n -k2 | cut -f2- | sed 's|^\./||' \
              | grep -viE '(^|/)(examples|test|tests|fixtures|docs)(/|$)' || true)

            # Split docker-exclude (comma- or space-separated) into an array with
            # globbing off, so a pattern like samples/* is not expanded against
            # the checkout before `case` matches it.
            EXCLUDES=()
            if [ -n "${DOCKER_EXCLUDE}" ]; then
              set -f
              read -ra EXCLUDES <<< "${DOCKER_EXCLUDE//,/ }"
              set +f
            fi

            while IFS= read -r f; do
              [ -z "$f" ] && continue
              skip=false
              for pat in "${EXCLUDES[@]}"; do
                # shellcheck disable=SC2254
                case "$f" in $pat) skip=true; break ;; esac
              done
              if [ "$skip" = true ]; then echo "  - skip (docker-exclude): $f"; continue; fi
              if [[ "$f" == */* ]]; then CTX=$(dirname "$f"); else CTX="."; fi
              TID=$(printf '%s' "$f" | tr '[:upper:]' '[:lower:]' | sed -e 's|[^a-z0-9]\+|-|g' -e 's|^-||' -e 's|-$||')
              DOCKER_JSON=$(printf '%s' "${DOCKER_JSON}" | jq -c --arg df "$f" --arg ctx "$CTX" --arg tid "$TID" \
                '. + [{dockerfile:$df, context:$ctx, "image-name":"", "target-id":$tid}]')
            done <<< "${CANDIDATES}"

            # docker-context / docker-image-name apply only when detection finds
            # exactly one Dockerfile; with several they are ambiguous.
            AUTO_COUNT=$(printf '%s' "${DOCKER_JSON}" | jq 'length')
            if [ "${AUTO_COUNT}" -eq 1 ]; then
              DOCKER_JSON=$(printf '%s' "${DOCKER_JSON}" | jq -c --arg ctx "${DOCKER_CONTEXT}" --arg img "${DOCKER_IMAGE}" '
                .[0] |= ( (if $ctx != "" then .context = $ctx else . end)
                        | (if $img != "" then ."image-name" = $img else . end) )')
            elif [ "${AUTO_COUNT}" -gt 1 ] && { [ -n "${DOCKER_CONTEXT}" ] || [ -n "${DOCKER_IMAGE}" ]; }; then
              echo "::warning::Auto-detection found ${AUTO_COUNT} Dockerfiles, so 'docker-context' and 'docker-image-name' are ignored. Use 'docker-targets' to set a context or image name per Dockerfile."
            fi
          fi
          DOCKER_COUNT=$(printf '%s' "${DOCKER_JSON}" | jq 'length')
          echo "Resolved ${DOCKER_COUNT} Docker target(s):"
          printf '%s' "${DOCKER_JSON}" | jq -r '.[] | "  - \(.dockerfile)  (id: \(.["target-id"]), context: \(.context))"' || true

          # ════════════════════════════════════════════════════════════════════
          # Changed files (PR, push to a non-main branch)
          # ════════════════════════════════════════════════════════════════════
          # `case` pattern match against a list; `*` also matches `/`. Patterns
          # arrive quoted, so they are never expanded against the checkout.
          matches_any() {
            local f="$1" pat; shift
            for pat in "$@"; do
              # shellcheck disable=SC2254
              case "$f" in $pat) return 0 ;; esac
            done
            return 1
          }

          ZERO_SHA=0000000000000000000000000000000000000000
          CHANGED=""; CHANGED_KNOWN=false
          if [ "${EVENT}" = "pull_request" ]; then
            # actions/checkout checks out the PR merge commit; its first parent
            # is the current base, so HEAD^1..HEAD is exactly the PR's change.
            if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
              if CHANGED=$(git diff --name-only --no-renames 'HEAD^1' HEAD); then
                CHANGED_KNOWN=true
              else
                echo "::warning::git diff against the PR base failed; treating every path as changed."
              fi
            else
              echo "::warning::HEAD is not a merge commit; cannot tell what the PR changes, so every path is treated as changed."
            fi
          elif [ "${EVENT}" = "push" ] && [ "${REF_TYPE}" = "branch" ] && [ "${REF_NAME}" != "${MAIN_BRANCH}" ]; then
            if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "${ZERO_SHA}" ] \
               && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              if CHANGED=$(git diff --name-only --no-renames "${BEFORE_SHA}" HEAD); then
                CHANGED_KNOWN=true
              fi
            else
              echo "Push base not available (new branch or force-push): no docs-only skip."
            fi
          fi
          if [ "${CHANGED_KNOWN}" = true ]; then
            echo "Changed paths: $(printf '%s\n' "${CHANGED}" | grep -c . || true)"
          fi

          # ════════════════════════════════════════════════════════════════════
          # Docs-only (6.8)
          # ════════════════════════════════════════════════════════════════════
          DOCS_PATTERNS=()
          while IFS= read -r p; do
            p="${p#"${p%%[![:space:]]*}"}"; p="${p%"${p##*[![:space:]]}"}"
            [ -n "$p" ] && DOCS_PATTERNS+=("$p")
          done <<< "${DOCS_ONLY_PATHS}"

          DOCS_ONLY=false
          if [ "${CHANGED_KNOWN}" = true ] && [ -n "${CHANGED}" ] && [ "${#DOCS_PATTERNS[@]}" -gt 0 ]; then
            DOCS_ONLY=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if ! matches_any "$f" "${DOCS_PATTERNS[@]}"; then
                DOCS_ONLY=false
                break
              fi
            done <<< "${CHANGED}"
          fi
          [ "${DOCS_ONLY}" = true ] && echo "Docs-only change: Sonar, Docker lint and image jobs are skipped."

          # ════════════════════════════════════════════════════════════════════
          # Sonar change detection (6.5): pull requests only
          # ════════════════════════════════════════════════════════════════════
          SONAR_SCAN="${SONAR_JSON}"
          if [ "${EVENT}" = "pull_request" ] && [ "${CHANGED_KNOWN}" = true ] \
             && [ "${DOCS_ONLY}" != true ] && [ "${SONAR_TOTAL}" -gt 0 ]; then
            GLOBAL=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if matches_any "$f" '.github/workflows/*' 'sonar-project.properties'; then
                echo "Global trigger changed ($f): every Sonar project is scanned."
                GLOBAL=true
                break
              fi
            done <<< "${CHANGED}"

            if [ "${GLOBAL}" != true ]; then
              SONAR_SCAN='[]'
              while IFS= read -r P; do
                [ -z "$P" ] && continue
                KEY=$(printf '%s' "$P" | jq -r '.key')
                BASE=$(printf '%s' "$P" | jq -r '(."base-dir" // "") | sub("^(\\./)+"; "") | sub("/+$"; "")')
                GLOBS=()
                while IFS= read -r g; do
                  [ -n "$g" ] && GLOBS+=("$g")
                done < <(printf '%s' "$P" | jq -r '(.paths // []) | if type == "string" then [.] else . end | .[]')

                HIT=false
                if [ -z "${BASE}" ] || [ "${BASE}" = "." ]; then
                  HIT=true
                else
                  while IFS= read -r f; do
                    [ -z "$f" ] && continue
                    if [ "$f" = "${BASE}" ] || [[ "$f" == "${BASE}"/* ]]; then HIT=true; break; fi
                    if [ "${#GLOBS[@]}" -gt 0 ] && matches_any "$f" "${GLOBS[@]}"; then HIT=true; break; fi
                  done <<< "${CHANGED}"
                fi

                if [ "${HIT}" = true ]; then
                  echo "  - ${KEY}: affected"
                  SONAR_SCAN=$(printf '%s' "${SONAR_SCAN}" | jq -c --argjson p "$P" '. + [$p]')
                else
                  echo "  - ${KEY}: unchanged, not scanned"
                fi
              done < <(printf '%s' "${SONAR_JSON}" | jq -c '.[]')
            fi
          fi

          # ════════════════════════════════════════════════════════════════════
          # Event gating (6.6) + docs-only
          # ════════════════════════════════════════════════════════════════════
          RUN_SONAR=true; RUN_LINT=true; RUN_IMAGE="${BUILD_IMAGE}"
          case "${EVENT}" in
            schedule|release) RUN_SONAR=false; RUN_LINT=false ;;
          esac
          if [ "${DOCS_ONLY}" = true ]; then RUN_SONAR=false; RUN_LINT=false; RUN_IMAGE=false; fi

          [ "${RUN_SONAR}" = true ] || SONAR_SCAN='[]'
          LINT_JSON='[]';  [ "${RUN_LINT}" = true ]  && LINT_JSON="${DOCKER_JSON}"
          IMAGE_JSON='[]'; [ "${RUN_IMAGE}" = true ] && IMAGE_JSON="${DOCKER_JSON}"

          SONAR_COUNT=$(printf '%s' "${SONAR_SCAN}" | jq 'length')
          LINT_COUNT=$(printf '%s' "${LINT_JSON}" | jq 'length')
          IMAGE_COUNT=$(printf '%s' "${IMAGE_JSON}" | jq 'length')

          {
            echo "sonar-projects=${SONAR_SCAN}"
            echo "sonar-count=${SONAR_COUNT}"
            echo "sonar-total=${SONAR_TOTAL}"
            echo "docker-targets=${DOCKER_JSON}"
            echo "docker-count=${DOCKER_COUNT}"
            echo "lint-targets=${LINT_JSON}"
            echo "lint-count=${LINT_COUNT}"
            echo "image-targets=${IMAGE_JSON}"
            echo "image-count=${IMAGE_COUNT}"
            echo "docs-only=${DOCS_ONLY}"
          } >> "$GITHUB_OUTPUT"
          echo "Plan for '${EVENT}': Sonar ${SONAR_COUNT}/${SONAR_TOTAL}, Dockerfile lint ${LINT_COUNT}, image ${IMAGE_COUNT}, docs-only ${DOCS_ONLY}."

      # ── Secret scan (full history on schedule) ──────────────────────────
      # Runs even if the plan failed: a malformed input must not hide a leak.
      - name: Secret scan
        id: secret
        if: ${{ !cancelled() && github.event_name != 'release' }}
        uses: $/.github/actions/secret-scan
        with:
          full-scan: ${{ inputs.secret-scan-full-history || github.event_name == 'schedule' }}
          gitleaks-license: ${{ secrets.GITLEAKS_LICENSE }}
          upload-sarif: "true"         # only where code scanning is available
          fail-on-findings: "false"

      # ── Dependency CVE scan (7.1) ───────────────────────────────────────
      # BEFORE the licence scan: its verdict must be recorded before
      # install-command runs caller code (which could otherwise tamper with
      # the scan through $GITHUB_ENV, e.g. BASH_ENV). Trivy fs reads lock
      # files, so it gains nothing from installed packages. Runs on docs-only
      # changes too: a CVE published since the last run is news either way,
      # and the step costs seconds inside a job that runs anyway.
      - name: Dependency scan
        id: dependency
        if: ${{ !cancelled() && github.event_name != 'release' && inputs.dependency-scan }}
        uses: $/.github/actions/dependency-scan
        with:
          severity: ${{ inputs.dependency-scan-severity }}
          fail-on-findings: "false"

      # ── Licence scan: LAST, because install-command runs caller code ────
      - name: Licence scan
        id: licence
        if: ${{ !cancelled() && github.event_name != 'release' }}
        uses: $/.github/actions/licence-scan
        with:
          forbidden-licenses: ${{ inputs.forbidden-licenses }}
          install-command: ${{ inputs.license-install-command }}
          fail-on-findings: "false"

      # The gate re-checks the results from the job outputs, which caller
      # code in install-command cannot change; this step only makes the job
      # itself red.
      - name: Fail on secret, dependency or licence findings
        if: ${{ !cancelled() && github.event_name != 'release' }}
        shell: bash
        env:
          SECRET_RESULT:  ${{ steps.secret.outputs.result }}
          SECRET_COUNT:   ${{ steps.secret.outputs.findings-count }}
          LICENCE_RESULT: ${{ steps.licence.outputs.result }}
          LICENCE_COUNT:  ${{ steps.licence.outputs.findings-count }}
          DEP_ENABLED:    ${{ inputs.dependency-scan }}
          DEP_RESULT:     ${{ steps.dependency.outputs.result }}
          DEP_COUNT:      ${{ steps.dependency.outputs.findings-count }}
        run: |
          rc=0
          if [ "${SECRET_RESULT}" != "clean" ]; then
            echo "::error::Secret scan: ${SECRET_RESULT:-did not run} (${SECRET_COUNT:-unknown} finding(s)). See the 'Secret scan' step and the gitleaks-report artifact."
            rc=1
          fi
          if [ "${LICENCE_RESULT}" != "clean" ]; then
            echo "::error::Licence scan: ${LICENCE_RESULT:-did not run} (${LICENCE_COUNT:-unknown} violation(s)). See the 'Licence scan' step and the license-report artifact."
            rc=1
          fi
          if [ "${DEP_ENABLED}" = "true" ] && [ "${DEP_RESULT}" != "clean" ]; then
            echo "::error::Dependency scan: ${DEP_RESULT:-did not run} (${DEP_COUNT:-unknown} vulnerability finding(s)). See the 'Dependency scan' step and the dependency-vuln-report artifact."
            rc=1
          fi
          [ "${rc}" -eq 0 ] && echo "Secret, dependency and licence scans clean."
          exit "${rc}"

  # ── SonarCloud (single OR monorepo, matrixed) ──────────────────────────────
  # One leg per project the plan selected (on a PR: the changed ones only).
  # Each leg is its own SonarCloud project with its own Quality Gate and
  # project-labelled PR decoration, and waits for that Quality Gate.
  sonarcloud:
    name: SonarCloud (${{ matrix.proj.key }})
    needs: [fast-checks]
    if: ${{ !cancelled() && needs.fast-checks.outputs.sonar-count > 0 }}
    strategy:
      fail-fast: false              # one project's gate failing must not cancel the others
      matrix:
        proj: ${{ fromJSON(needs.fast-checks.outputs.sonar-projects) }}
    # read-only: PR decoration uses SONAR_TOKEN, not the GitHub token
    permissions:
      contents: read
    uses: $/.github/workflows/sonarcloud.yml
    with:
      project-key:            ${{ matrix.proj.key }}
      project-name:           ${{ matrix.proj.project-name }}
      base-dir:               ${{ matrix.proj.base-dir }}
      sources:                ${{ matrix.proj.sources }}
      python-version:         ${{ matrix.proj.python-version }}
      node-version:           ${{ matrix.proj.node-version }}
      java-version:           ${{ matrix.proj.java-version }}
      python-coverage-report: ${{ matrix.proj.python-coverage-report }}
      js-coverage-report:     ${{ matrix.proj.js-coverage-report }}
      coverage-artifact:      ${{ matrix.proj.coverage-artifact }}
      sonar-extra-args:       ${{ matrix.proj.sonar-extra-args }}
      runner:                 ${{ inputs.runner }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── Dockerfile lint: every Dockerfile in ONE job (6.4) ─────────────────────
  # Hadolint installed once, Checkov pulled once. One artifact,
  # `docker-lint-results`, holds every target's docker-lint-result.json.
  docker-lint:
    name: Dockerfile lint
    needs: [fast-checks]
    if: ${{ !cancelled() && needs.fast-checks.outputs.lint-count > 0 }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read           # checkout
      security-events: write   # Hadolint/Checkov SARIF upload
      actions: read            # SARIF upload reads workflow run metadata (private repos)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dockerfile lint
        uses: $/.github/actions/docker-lint
        with:
          targets: ${{ needs.fast-checks.outputs.lint-targets }}
          artifact-name: docker-lint-results
          fail-on-findings: "true"

  # ── Image build + scan (opt-in, 6.9) ───────────────────────────────────────
  # One leg per Dockerfile. Read-only token (ROADMAP 1.3): this job builds a
  # possibly PR-supplied Dockerfile. Schedule: CVE scan only (no SBOM, no
  # Dive). Release: no build cache, so the published SBOM comes from a clean
  # build; publishing happens in image-publish.
  image:
    name: Image (${{ matrix.tgt.target-id }})
    needs: [fast-checks]
    if: ${{ !cancelled() && needs.fast-checks.outputs.image-count > 0 }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false              # one image's findings must not cancel the others
      matrix:
        tgt: ${{ fromJSON(needs.fast-checks.outputs.image-targets) }}
    permissions:
      contents: read           # checkout
      security-events: write   # Trivy/Grype SARIF upload
      actions: read            # SARIF upload reads workflow run metadata (private repos)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check image
        uses: $/.github/actions/docker-image
        with:
          dockerfile:           ${{ matrix.tgt.dockerfile }}
          context:              ${{ matrix.tgt.context }}
          image-name:           ${{ matrix.tgt.image-name || format('orion-docker-check-{0}:ci', matrix.tgt.target-id) }}
          target-id:            ${{ matrix.tgt.target-id }}
          npm-token:            ${{ secrets.AZURE_NPM_TOKEN }}
          gha-cache:            ${{ github.event_name != 'release' }}
          trivy-severity:       ${{ inputs.docker-trivy-severity }}
          trivy-ignore-unfixed: ${{ inputs.docker-trivy-ignore-unfixed }}
          grype-enable:         ${{ inputs.docker-grype-enable }}
          sbom-enable:          ${{ github.event_name != 'schedule' }}
          dive-enable:          ${{ github.event_name != 'schedule' && inputs.docker-dive-enable }}
          dive-min-efficiency:  ${{ inputs.docker-dive-min-efficiency }}
          fail-on-findings:     "true"

  # ── Publish container SBOMs (release only) ─────────────────────────────────
  # Holds the write scope the image job must not have. Runs no repository
  # code (no checkout): it only uploads the SBOM files the image legs
  # produced, also when a leg failed on a scan or Dive finding (as v1's
  # image-sbom job did). A leg whose image did not build has no SBOM.
  image-publish:
    name: Publish container SBOMs
    needs: [fast-checks, image]
    if: >-
      ${{ !cancelled()
          && github.event_name == 'release'
          && needs.fast-checks.outputs.image-count > 0
          && (needs.image.result == 'success' || needs.image.result == 'failure') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: write          # gh release upload
    steps:
      - name: Download container SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true    # no match when no image built; checked below
        with:
          pattern: docker-sbom-*
          merge-multiple: true
          path: ${{ runner.temp }}/sbom

      - name: Attach SBOMs to the GitHub Release
        shell: bash
        env:
          GH_TOKEN:     ${{ github.token }}
          REPO:         ${{ github.repository }}
          TAG:          ${{ github.event.release.tag_name }}
          SBOM_DIR:     ${{ runner.temp }}/sbom
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=("${SBOM_DIR}"/*.spdx.json "${SBOM_DIR}"/*.cyclonedx.json)
          if [ "${#FILES[@]}" -eq 0 ]; then
            if [ "${IMAGE_RESULT}" = "success" ]; then
              echo "::error::The image job succeeded but no container SBOM artifact (docker-sbom-*) was found."
              exit 1
            fi
            echo "::warning::No container SBOM to attach: no image built (see the image job)."
            exit 0
          fi
          gh release upload "${TAG}" "${FILES[@]}" --clobber --repo "${REPO}"
          {
            echo "### Container SBOMs published"
            echo ""
            for f in "${FILES[@]}"; do echo "- \`$(basename "$f")\` attached to GitHub Release **${TAG}**"; done
          } >> "${GITHUB_STEP_SUMMARY}"

  release-please:
    name: Release Please
    needs: [fast-checks, sonarcloud, docker-lint, image]
    # ── TEMPORARILY DISABLED org-wide (2026-06-06) ───────────────────────────
    # Release automation is paused until every consuming repo is migrated to the
    # caller inputs (release-type / release-manifest). The job stays defined so
    # the gate's `needs` and the workflow outputs still resolve, but the
    # leading `false` below keeps it permanently skipped.
    # TO RE-ENABLE: delete the `false &&` line.
    if: >-
      false &&
      always() &&
      (inputs.release-type != '' || inputs.release-manifest) &&
      github.event_name == 'push' &&
      github.ref_name == inputs.main-branch &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    # write to open/update the Release PR, tag the release and attach SBOMs
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/release-please.yml
    with:
      release-type:             ${{ inputs.release-type }}
      manifest-mode:            ${{ inputs.release-manifest }}
      target-branch:            ${{ inputs.main-branch }}
      generate-sbom-on-release: true
      app-id:                   ${{ inputs.release-app-id }}
      runner:                   ${{ inputs.runner }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  sbom:
    name: SBOM Generation
    needs: [fast-checks, sonarcloud, docker-lint, image]
    if: >-
      always() &&
      (
        (github.event_name == 'push' && github.ref_name == inputs.main-branch) ||
        github.event_name == 'release'
      ) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    # write only for attaching SBOMs + attestation to releases
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: $/.github/workflows/sbom.yml
    with:
      attach-to-release: ${{ github.event_name == 'release' }}
      runner:            ${{ inputs.runner }}

  # ── CI gate: the ONE required check (6.2) ──────────────────────────────────
  # `always()`, never `!cancelled()`: a skipped gate would count as a passing
  # required check. The report steps come first and are continue-on-error, so
  # nothing they read (artifacts, SonarCloud API) can change the verdict; the
  # last step decides from job results and fast-checks outputs only.
  gate:
    name: CI gate
    needs: [fast-checks, sonarcloud, docker-lint, image, image-publish, release-please, sbom]
    if: always()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    # read-only: downloads this run's artifacts and writes the step summary
    permissions:
      contents: read

    steps:
      # ── Download artifacts (each may be absent when its job was skipped) ──
      - name: Download Gitleaks report
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gitleaks-report
          path: ./reports/gitleaks
        continue-on-error: true

      - name: Download license report
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: license-report
          path: ./reports/license
        continue-on-error: true

      - name: Download dependency vulnerability report
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-vuln-report
          path: ./reports/dependency
        continue-on-error: true

      # One artifact per image leg (docker-vuln-report-<target-id>), each in
      # its own ./reports/docker/<artifact-name>/ directory.
      - name: Download Docker vulnerability reports
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-vuln-report*
          path: ./reports/docker
        continue-on-error: true

      # ONE artifact, docker-lint-results: docker-lint-result.json at its
      # root for one target, docker-lint-result-<id>/docker-lint-result.json
      # for several. The report finds them with `find`.
      - name: Download Docker lint findings
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-lint-results
          path: ./reports/docker-lint
        continue-on-error: true

      # ── Fetch SonarCloud data (per scanned project) ─────────────────────
      # Each Sonar leg already waited for its Quality Gate, so the results are
      # final: read them once (no polling). Report APIs use
      # SONAR_ISSUE_RETRIEVAL only — SONAR_TOKEN is for the scan. Every query
      # is scoped to this run's analysis: &pullRequest=<n> on a PR,
      # &branch=<name> on a push to a non-main branch, the main branch
      # otherwise. SONAR_FETCHED=false (with SONAR_FETCH_NOTE) tells the later
      # steps to fall back to the job result instead of printing 0/N.
      - name: Fetch SonarCloud data
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RESULT_SONAR:           ${{ needs.sonarcloud.result }}
          SONAR_ISSUE_RETRIEVAL:  ${{ secrets.SONAR_ISSUE_RETRIEVAL }}
          SONAR_PROJECTS:         ${{ needs.fast-checks.outputs.sonar-projects }}
          SONAR_TOTAL_CFG:        ${{ needs.fast-checks.outputs.sonar-total }}
          DOCS_ONLY:              ${{ needs.fast-checks.outputs.docs-only }}
          EVENT:                  ${{ github.event_name }}
          PR_NUMBER:              ${{ github.event.pull_request.number }}
          REF_NAME:               ${{ github.ref_name }}
          REF_TYPE:               ${{ github.ref_type }}
          MAIN_BRANCH:            ${{ inputs.main-branch }}
        run: |
          set -uo pipefail
          SONAR_URL="https://sonarcloud.io"
          mkdir -p ./sonar-data

          # Why Sonar did not run (fixed strings only).
          if   [ "${SONAR_TOTAL_CFG:-0}" = "0" ] || [ -z "${SONAR_TOTAL_CFG:-}" ]; then SKIP="no SonarCloud project configured"
          elif [ "${EVENT}" = "schedule" ] || [ "${EVENT}" = "release" ]; then SKIP="not run on ${EVENT} events"
          elif [ "${DOCS_ONLY:-false}" = "true" ]; then SKIP="documentation-only change"
          else SKIP="no SonarCloud project affected by this change"
          fi

          # Analysis scope (query-string suffix). Branch names are URL-encoded.
          SONAR_QS=""
          if [ "${EVENT}" = "pull_request" ] && [ -n "${PR_NUMBER:-}" ]; then
            SONAR_QS="&pullRequest=${PR_NUMBER}"
          elif [ "${EVENT}" = "push" ] && [ "${REF_TYPE}" = "branch" ] && [ "${REF_NAME}" != "${MAIN_BRANCH}" ]; then
            SONAR_QS="&branch=$(jq -rn --arg b "${REF_NAME}" '$b | @uri')"
          fi

          KEYS=$(printf '%s' "${SONAR_PROJECTS:-[]}" | jq -r '.[].key' 2>/dev/null || true)
          TOTAL=0; PASS=0; FETCHED=0; NOTE=""

          if [ -z "${SONAR_ISSUE_RETRIEVAL:-}" ]; then
            NOTE="SONAR_ISSUE_RETRIEVAL not set"
          fi

          if [ -n "${SONAR_ISSUE_RETRIEVAL:-}" ] && [ "${RESULT_SONAR}" != "skipped" ] && [ -n "${KEYS}" ]; then
            echo "SonarCloud analysis scope: ${SONAR_QS:-(main branch)}"

            # Retry helper — up to 3 attempts with 5s backoff; returns '{}' on failure.
            sonar_api() {
              local url="$1" attempt body http_code
              for attempt in 1 2 3; do
                body=$(curl -s --max-time 15 -w '\n%{http_code}' \
                  -H "Authorization: Bearer ${SONAR_ISSUE_RETRIEVAL}" "$url" 2>/dev/null || true)
                http_code=$(echo "$body" | tail -1)
                body=$(echo "$body" | sed '$d')
                if [ "$http_code" = "200" ] && echo "$body" | jq . >/dev/null 2>&1; then
                  echo "$body"; return 0
                fi
                echo "::warning::SonarCloud API attempt $attempt failed (HTTP $http_code) for $url" >&2
                sleep 5
              done
              echo '{}'
            }

            METRIC_KEYS="bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density"
            METRIC_KEYS="${METRIC_KEYS},security_hotspots,ncloc,sqale_index"
            METRIC_KEYS="${METRIC_KEYS},reliability_rating,security_rating,sqale_rating"
            METRIC_KEYS="${METRIC_KEYS},new_bugs,new_vulnerabilities,new_code_smells"
            METRIC_KEYS="${METRIC_KEYS},new_coverage,new_security_hotspots,new_security_review_rating"

            while IFS= read -r PROJECT_KEY; do
              [ -z "$PROJECT_KEY" ] && continue
              TOTAL=$((TOTAL+1))
              D="./sonar-data/$(printf '%s' "$PROJECT_KEY" | sed 's|[^A-Za-z0-9._-]|_|g')"
              mkdir -p "$D"
              printf '%s' "$PROJECT_KEY" > "$D/key.txt"

              sonar_api "${SONAR_URL}/api/qualitygates/project_status?projectKey=${PROJECT_KEY}${SONAR_QS}"                                                              > "$D/qg.json"
              sonar_api "${SONAR_URL}/api/measures/component?component=${PROJECT_KEY}&metricKeys=${METRIC_KEYS}${SONAR_QS}"                                              > "$D/measures.json"
              sonar_api "${SONAR_URL}/api/issues/search?componentKeys=${PROJECT_KEY}&statuses=OPEN,CONFIRMED,REOPENED&ps=15&s=SEVERITY&asc=false&facets=types,severities${SONAR_QS}" > "$D/issues.json"
              sonar_api "${SONAR_URL}/api/hotspots/search?projectKey=${PROJECT_KEY}&ps=10&status=TO_REVIEW${SONAR_QS}"                                                   > "$D/hotspots.json"

              ST=$(jq -r '.projectStatus.status // "UNKNOWN"' "$D/qg.json" 2>/dev/null || echo "UNKNOWN")
              [ "$ST" = "OK" ] && PASS=$((PASS+1))
              [ "$ST" != "UNKNOWN" ] && FETCHED=$((FETCHED+1))
              printf '%s' "$ST" > "$D/qg_status.txt"
              echo "  ${PROJECT_KEY}: Quality Gate ${ST}"
            done <<< "${KEYS}"
            [ "${FETCHED}" -eq 0 ] && NOTE="SonarCloud API returned no Quality Gate data"
          else
            # Data can't be fetched (no token / skipped) — still count projects for the dashboard.
            TOTAL=$(printf '%s' "${SONAR_PROJECTS:-[]}" | jq 'length' 2>/dev/null || echo 0)
          fi

          {
            echo "SONAR_TOTAL=${TOTAL}"
            echo "SONAR_PASS=${PASS}"
            [ "${FETCHED}" -gt 0 ] && echo "SONAR_FETCHED=true" || echo "SONAR_FETCHED=false"
            echo "SONAR_FETCH_NOTE=${NOTE}"
            echo "SONAR_QS=${SONAR_QS}"
            echo "SONAR_SKIP_REASON=${SKIP}"
          } >> "$GITHUB_ENV"

      # ── Header + dashboard table ────────────────────────────────────────
      - name: Report — header and dashboard
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RESULT_FAST:     ${{ needs.fast-checks.result }}
          RESULT_SONAR:    ${{ needs.sonarcloud.result }}
          RESULT_LINT:     ${{ needs.docker-lint.result }}
          RESULT_IMAGE:    ${{ needs.image.result }}
          RESULT_PUBLISH:  ${{ needs.image-publish.result }}
          RESULT_RELEASE:  ${{ needs.release-please.result }}
          RESULT_SBOM:     ${{ needs.sbom.result }}
          PLAN_OUTCOME:    ${{ needs.fast-checks.outputs.plan-outcome }}
          SECRET_RESULT:   ${{ needs.fast-checks.outputs.secret-result }}
          LICENCE_RESULT:  ${{ needs.fast-checks.outputs.licence-result }}
          DEP_RESULT:      ${{ needs.fast-checks.outputs.dependency-result }}
          DEP_ENABLED:     ${{ inputs.dependency-scan }}
          SONAR_COUNT:     ${{ needs.fast-checks.outputs.sonar-count }}
          SONAR_TOTAL_CFG: ${{ needs.fast-checks.outputs.sonar-total }}
          DOCKER_TOTAL:    ${{ needs.fast-checks.outputs.docker-count }}
          LINT_COUNT:      ${{ needs.fast-checks.outputs.lint-count }}
          IMAGE_COUNT:     ${{ needs.fast-checks.outputs.image-count }}
          DOCS_ONLY:       ${{ needs.fast-checks.outputs.docs-only }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release-created }}
          RELEASE_TAG:     ${{ needs.release-please.outputs.tag-name }}
          EVENT:           ${{ github.event_name }}
          REF:             ${{ github.ref_name }}
          SHA:             ${{ github.sha }}
          REPO:            ${{ github.repository }}
          RUN_ID:          ${{ github.run_id }}
          SERVER_URL:      ${{ github.server_url }}
          RUNNER_NAME:     ${{ inputs.runner }}
        run: |
          set -uo pipefail
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          SHA_SHORT="${SHA:0:7}"

          status_icon() {
            case "$1" in
              success)   echo "✅ Passed"    ;;
              failure)   echo "❌ Failed"    ;;
              cancelled) echo "🚫 Cancelled" ;;
              skipped)   echo "⏭️ Skipped"  ;;
              *)         echo "⬜ Unknown"   ;;
            esac
          }
          # A scan's status from its verdict output (clean | findings | error).
          scan_status() {
            case "$1" in
              clean) echo success ;;
              findings|error) echo failure ;;
              *) if [ "${RESULT_FAST}" = "success" ] || [ "${EVENT}" = "release" ]; then echo skipped; else echo "${RESULT_FAST}"; fi ;;
            esac
          }
          RESULT_SECRET=$(scan_status "${SECRET_RESULT}")
          RESULT_LICENSE=$(scan_status "${LICENCE_RESULT}")
          RESULT_DEP=$(scan_status "${DEP_RESULT}")

          OVERALL_PASS=true
          for r in "$RESULT_FAST" "$RESULT_SONAR" "$RESULT_LINT" "$RESULT_IMAGE" "$RESULT_PUBLISH" "$RESULT_RELEASE" "$RESULT_SBOM"; do
            { [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; } && OVERALL_PASS=false && break
          done
          [ "$OVERALL_PASS" = "true" ] \
            && BANNER="## ✅ Orion CI — All Checks Passed" \
            || BANNER="## ❌ Orion CI — One or More Checks Failed"

          # One-line detail per stage
          if [ "${PLAN_OUTCOME}" = "success" ]; then
            PD="Sonar ${SONAR_COUNT:-0}/${SONAR_TOTAL_CFG:-0} project(s), Dockerfile lint ${LINT_COUNT:-0}/${DOCKER_TOTAL:-0}, image ${IMAGE_COUNT:-0}"
            [ "${DOCS_ONLY:-false}" = "true" ] && PD="${PD} — documentation-only change"
          elif [ "${PLAN_OUTCOME}" = "failure" ]; then
            PD="Invalid caller inputs — see the Plan step of Fast checks (dependent jobs skipped)"
          elif [ "${RESULT_FAST}" = "skipped" ]; then
            PD="Skipped (release event without image build)"
          else
            PD="$(status_icon "$RESULT_FAST")"
          fi

          GL_FILE="./reports/gitleaks/gitleaks-full-report.json"
          if   [ "$RESULT_SECRET" = "skipped" ]; then SD="Skipped"
          elif [ ! -f "$GL_FILE" ];              then SD="Report artifact unavailable"
          elif [ "${SECRET_RESULT}" = "error" ]; then SD="Scan did not complete — see the Secret scan step"
          else
            N=$(jq '.findings | length' "$GL_FILE" 2>/dev/null || echo 0)
            [ "$N" -eq 0 ] && SD="No secrets detected" || SD="${N} secret(s) found — rotate credentials"
          fi

          # Per-project counts only when the report could actually read SonarCloud;
          # otherwise fall back to the job result (never a misleading "0/N passed").
          SONAR_NOTE=""
          [ -n "${SONAR_FETCH_NOTE:-}" ] && SONAR_NOTE=" (details unavailable: ${SONAR_FETCH_NOTE})"
          if   [ "$RESULT_SONAR" = "skipped" ];   then SND="Skipped — ${SONAR_SKIP_REASON:-not run}"
          elif [ "${SONAR_FETCHED:-false}" = "true" ] && [ "${SONAR_TOTAL:-0}" -gt 0 ]; then SND="${SONAR_PASS:-0}/${SONAR_TOTAL} Quality Gate(s) passed"
          elif [ "$RESULT_SONAR" = "success" ];   then SND="Quality Gate passed${SONAR_NOTE}"
          elif [ "$RESULT_SONAR" = "failure" ];   then SND="Quality Gate failed or scan error${SONAR_NOTE}"
          else SND="$(status_icon "$RESULT_SONAR")"
          fi

          LC_FILE="./reports/license/license-report.json"
          if   [ "$RESULT_LICENSE" = "skipped" ]; then LD="Skipped (release event)"
          elif [ ! -f "$LC_FILE" ];               then LD="Report artifact unavailable"
          else
            V=$(jq '.meta.violation_count // 0' "$LC_FILE" 2>/dev/null || echo 0)
            T=$(jq '.meta.total_packages  // 0' "$LC_FILE" 2>/dev/null || echo 0)
            R=$(jq '[.results[]?.Licenses[]? | select(.Category=="restricted")] | length' "$LC_FILE" 2>/dev/null || echo 0)
            if   [ "$V" -gt 0 ]; then LD="${V} forbidden license(s) in ${T} packages"
            elif [ "$R" -gt 0 ]; then LD="${R} restricted license(s) detected (${T} packages)"
            else LD="No violations (${T} packages scanned)"
            fi
          fi

          DEP_FILE="./reports/dependency/dependency-vuln-report.json"
          if   [ "${DEP_ENABLED}" != "true" ];     then RESULT_DEP=skipped; DD="Skipped — dependency-scan is off"
          elif [ "$RESULT_DEP" = "skipped" ];      then DD="Skipped (release event)"
          elif [ "${DEP_RESULT}" = "error" ];      then DD="Scan did not complete — see the Dependency scan step"
          elif [ ! -f "$DEP_FILE" ];               then DD="Report artifact unavailable"
          else
            DN=$(jq '.meta.vulnerability_count // 0' "$DEP_FILE" 2>/dev/null || echo 0)
            DS=$(jq -r '.meta.severity_filter // "CRITICAL,HIGH"' "$DEP_FILE" 2>/dev/null || echo "CRITICAL,HIGH")
            DT=$(jq '.meta.targets_scanned // 0' "$DEP_FILE" 2>/dev/null || echo 0)
            DB=$(jq -r '(.meta.by_severity // {}) | to_entries | map("\(.value) \(.key | ascii_downcase)") | join(", ")' "$DEP_FILE" 2>/dev/null || echo "")
            if [ "${DN:-0}" -gt 0 ] 2>/dev/null; then DD="${DN} vulnerable dependency finding(s) at ${DS} (${DB}) — see the dependency-vuln-report artifact"
            else DD="No vulnerabilities at ${DS} (${DT} lock file(s) or manifest(s) scanned)"
            fi
          fi

          if   [ "$RESULT_RELEASE" = "skipped" ];                              then RD="Skipped"
          elif [ "${RELEASE_CREATED:-}" = "true" ] && [ -n "${RELEASE_TAG:-}" ]; then RD="Released ${RELEASE_TAG}"
          elif [ "${RELEASE_CREATED:-}" = "true" ];                            then RD="Released (manifest — multiple packages)"
          elif [ "$RESULT_RELEASE" = "success" ];                              then RD="No release created — PR may be pending"
          else RD="$(status_icon "$RESULT_RELEASE")"
          fi

          if   [ "$RESULT_SBOM" = "skipped" ]; then SBOMD="Skipped — only runs on push to main or release"
          elif [ "$RESULT_SBOM" = "success" ]; then SBOMD="SPDX + CycloneDX generated"
          else SBOMD="$(status_icon "$RESULT_SBOM")"
          fi

          if   [ "${DOCKER_TOTAL:-0}" = "0" ] || [ -z "${DOCKER_TOTAL:-}" ]; then LND="Skipped — no Dockerfile detected"
          elif [ "$RESULT_LINT" = "skipped" ]; then
            if [ "${DOCS_ONLY:-false}" = "true" ]; then LND="Skipped — documentation-only change"; else LND="Skipped — not run on ${EVENT} events"; fi
          elif [ "$RESULT_LINT" = "success" ]; then LND="Hadolint + Checkov passed (${LINT_COUNT:-?} Dockerfile(s))"
          else LND="$(status_icon "$RESULT_LINT") (${LINT_COUNT:-?} Dockerfile(s))"
          fi

          DK_FILES=$(find ./reports/docker -name 'docker-vuln-report.json' 2>/dev/null || true)
          if [ "$RESULT_IMAGE" = "skipped" ]; then
            if [ "${DOCS_ONLY:-false}" = "true" ]; then IMD="Skipped — documentation-only change"; else IMD="Skipped — image build is off (docker-build-image) or no Dockerfile"; fi
          elif [ -z "${DK_FILES}" ]; then IMD="$(status_icon "$RESULT_IMAGE")"
          else
            TOTAL_VULN=$(printf '%s\n' "${DK_FILES}" | while IFS= read -r f; do [ -n "$f" ] && jq '.meta.vulnerability_count // 0' "$f" 2>/dev/null; done | awk '{s+=$1} END{print s+0}')
            SEVERITY=$(printf '%s\n' "${DK_FILES}" | head -1 | xargs -r jq -r '.meta.severity_filter // "CRITICAL,HIGH"' 2>/dev/null || echo "CRITICAL,HIGH")
            IMD="${TOTAL_VULN} vulnerability/vulnerabilities across ${IMAGE_COUNT:-?} image(s) at ${SEVERITY}"
          fi
          [ "$RESULT_PUBLISH" != "skipped" ] && IMD="${IMD}; SBOM publish: $(status_icon "$RESULT_PUBLISH")"

          REL_ST=$([ "${RELEASE_CREATED:-}" = "true" ] && echo "🚀 Released" || status_icon "$RESULT_RELEASE")

          {
            echo "${BANNER}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Trigger** | \`${EVENT}\` on \`${REF}\` |"
            echo "| **Commit** | [\`${SHA_SHORT}\`](${SERVER_URL}/${REPO}/commit/${SHA}) |"
            echo "| **Runner** | \`${RUNNER_NAME}\` |"
            echo "| **Run** | [View full run](${RUN_URL}) |"
            echo ""
            echo "### Pipeline Dashboard"
            echo ""
            echo "| Stage | Status | Details |"
            echo "|-------|--------|---------|"
            echo "| 🧭 Fast checks (plan) | $(status_icon "$RESULT_FAST") | ${PD} |"
            echo "| 🔐 Secret Scanning | $(status_icon "$RESULT_SECRET") | ${SD} |"
            echo "| 🧬 Dependency vulnerabilities | $(status_icon "$RESULT_DEP") | ${DD} |"
            echo "| ⚖️ License Compliance | $(status_icon "$RESULT_LICENSE") | ${LD} |"
            echo "| 🔍 SonarCloud | $(status_icon "$RESULT_SONAR") | ${SND} |"
            echo "| 🐳 Dockerfile lint | $(status_icon "$RESULT_LINT") | ${LND} |"
            echo "| 🏗️ Image build & scan | $(status_icon "$RESULT_IMAGE") | ${IMD} |"
            echo "| 🏷️ Release Please | ${REL_ST} | ${RD} |"
            echo "| 📦 SBOM | $(status_icon "$RESULT_SBOM") | ${SBOMD} |"
            echo ""
            echo "---"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Secret Scanning section ─────────────────────────────────────────
      - name: Report — secret scanning
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SECRET_RESULT: ${{ needs.fast-checks.outputs.secret-result }}
          REPO:          ${{ github.repository }}
          SERVER_URL:    ${{ github.server_url }}
        run: |
          set -uo pipefail
          GL_FILE="./reports/gitleaks/gitleaks-full-report.json"

          {
            echo "### 🔐 Secret Scanning (Gitleaks)"
            echo ""

            if [ -z "${SECRET_RESULT}" ]; then
              echo "⏭️ _Skipped or did not run_"
            elif [ -f "$GL_FILE" ]; then
              SCAN_TYPE=$(jq -r '.meta.scan_type // "unknown"' "$GL_FILE" 2>/dev/null || echo "unknown")
              GL_VER=$(jq    -r '.meta.gitleaks_version // ""'  "$GL_FILE" 2>/dev/null || echo "")
              FC=$(jq '.findings | length' "$GL_FILE" 2>/dev/null || echo 0)

              if [ "${SECRET_RESULT}" = "error" ]; then
                echo "**Status: ❌ The secret scan did not complete** — see the Secret scan step of Fast checks (${FC} possible finding(s) in a partial scan)"
              elif [ "$FC" -eq 0 ]; then
                echo "**Status: ✅ No secrets detected**"
              else
                echo "**Status: ❌ ${FC} secret(s) detected — rotate credentials immediately**"
              fi
              echo ""
              echo "> Scan type: \`${SCAN_TYPE}\` | Gitleaks \`${GL_VER}\`"
              echo ""

              if [ "$FC" -gt 0 ]; then
                echo "| Severity | File | Line | Rule | Description | Commit |"
                echo "|----------|------|------|------|-------------|--------|"
                jq -r --arg base "${SERVER_URL}/${REPO}/commit/" '
                  .findings[] |
                  ( .Tags // ["UNKNOWN"] | if type=="array" then .[0] else . end ) as $sev |
                  ( .Description // "—" | gsub("[|]";"\\|") | .[0:80] ) as $desc |
                  "| \($sev) | `\(.File // "unknown")` | \(.StartLine // "—") | `\(.RuleID // "—")` | \($desc) | [`\(.Commit[:7] // "—")`](\($base)\(.Commit // "")) |"
                ' "$GL_FILE" 2>/dev/null | head -20
                [ "$FC" -gt 20 ] && echo "" && echo "_...and $((FC-20)) more. Download the \`gitleaks-report\` artifact for the full list._"
                echo ""
                echo "> **Remediation:** Rotate any exposed credentials immediately."
                echo "> Remove secrets from git history using [\`git filter-repo\`](https://github.com/newren/git-filter-repo)."
                echo "> If a finding is a false positive, add it to \`.gitleaks.toml\` in your repository root."
              fi
            else
              echo "Result: \`${SECRET_RESULT}\` _(report artifact not available)_"
            fi

            echo ""
            echo "---"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ── SonarCloud section ───────────────────────────────────────────────
      - name: Report — SonarCloud
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RESULT_SONAR:          ${{ needs.sonarcloud.result }}
          SONAR_PROJECTS:        ${{ needs.fast-checks.outputs.sonar-projects }}
          REPO:                  ${{ github.repository }}
          SERVER_URL:            ${{ github.server_url }}
          SHA:                   ${{ github.sha }}
        run: |
          set -uo pipefail
          SONAR_URL="https://sonarcloud.io"

          rating_badge() {
            case "${1%.*}" in
              1) echo "🟢 A" ;; 2) echo "🟡 B" ;; 3) echo "🟠 C" ;;
              4) echo "🔴 D" ;; 5) echo "🔴 E" ;; *) echo "—"    ;;
            esac
          }
          fmt_number() { echo "$1" | awk '{printf "%\047d\n",$1}' 2>/dev/null || echo "$1"; }
          fmt_debt() {
            local m="$1"
            echo "$m" | grep -qE '^[0-9]+$' || { echo "—"; return; }
            local d=$(( m/480 )) h=$(( (m%480)/60 )) r=$(( m%60 )) o=""
            [ $d -gt 0 ] && o="${d}d "
            [ $h -gt 0 ] && o="${o}${h}h "
            [ $r -gt 0 ] && o="${o}${r}min"
            echo "${o%% }" | grep -q . && echo "${o%% }" || echo "< 1min"
          }
          # Overall metric value (ignores new-code period — always returns the total)
          m() {
            local v
            v=$(jq -r --arg k "$1" \
              '.component.measures[]? | select(.metric==$k) | .value // ""' \
              "${D}/measures.json" 2>/dev/null || true)
            [ -n "$v" ] && echo "$v" || echo "N/A"
          }
          # New-code period value (only set when a new-code period exists; the API
          # returns it as `periods[0]` or, e.g. for a pull request, as `period`)
          mn() {
            local v
            v=$(jq -r --arg k "$1" \
              '.component.measures[]? | select(.metric==$k) | (.periods[0].value // .period.value // "")' \
              "${D}/measures.json" 2>/dev/null || true)
            [ -n "$v" ] && echo "$v" || echo "N/A"
          }

          {
            echo "### 🔍 SonarCloud Code Quality"
            echo ""

            if [ "$RESULT_SONAR" = "skipped" ]; then
              echo "⏭️ _Skipped — ${SONAR_SKIP_REASON:-not run}_"
            elif [ "${SONAR_FETCHED:-false}" != "true" ]; then
              echo "$([ "$RESULT_SONAR" = "success" ] && echo "✅ Quality Gate passed" || echo "⚠️ Quality Gate failed or scan error") — _details unavailable (${SONAR_FETCH_NOTE:-no data fetched}); check the \`SONAR_ISSUE_RETRIEVAL\` secret_"
            else
              echo "**${SONAR_PASS:-0}/${SONAR_TOTAL:-0} project Quality Gate(s) passed**"
              echo ""

              # One collapsible block per project (single-project repos have exactly one).
              while IFS= read -r PROJECT_KEY; do
                [ -z "$PROJECT_KEY" ] && continue
                D="./sonar-data/$(printf '%s' "$PROJECT_KEY" | sed 's|[^A-Za-z0-9._-]|_|g')"
                [ -d "$D" ] || continue
                QG_STATUS=$(cat "$D/qg_status.txt" 2>/dev/null || echo "UNKNOWN")
                [ "$QG_STATUS" = "OK" ] && QG_ICON="✅ Passed" || QG_ICON="❌ Failed"

                echo "<details><summary>${QG_ICON} — <code>${PROJECT_KEY}</code></summary>"
                echo ""
                echo "[View in SonarCloud](${SONAR_URL}/project/overview?id=${PROJECT_KEY}${SONAR_QS:-})"
                echo ""

                FAILED_CONDS=$(jq -r '
                  .projectStatus.conditions[]? |
                  select(.status=="ERROR") |
                  "| \(.metricKey | gsub("_";" ") | ascii_upcase) | \(.actualValue) | \(.comparator) \(.errorThreshold) |"
                ' "$D/qg.json" 2>/dev/null || true)

                if [ -n "$FAILED_CONDS" ]; then
                  echo "<details open><summary>❌ Failed Quality Gate Conditions</summary>"
                  echo ""
                  echo "| Metric | Actual Value | Threshold |"
                  echo "|--------|-------------|-----------|"
                  echo "$FAILED_CONDS"
                  echo ""
                  echo "</details>"
                  echo ""
                fi

                BUGS=$(m bugs);      REL_R=$(m reliability_rating)
                VULNS=$(m vulnerabilities); SEC_R=$(m security_rating)
                SMELLS=$(m code_smells);   MNT_R=$(m sqale_rating)
                COV=$(m coverage);   DUP=$(m duplicated_lines_density)
                HS=$(m security_hotspots); LOC=$(m ncloc); DEBT=$(m sqale_index)

                echo "#### Overall Code Metrics"
                echo ""
                echo "| Metric | Value | Rating |"
                echo "|--------|-------|--------|"
                echo "| 🐛 Bugs | ${BUGS} | $(rating_badge "$REL_R") |"
                echo "| 🔒 Vulnerabilities | ${VULNS} | $(rating_badge "$SEC_R") |"
                echo "| 🔥 Security Hotspots | ${HS} | — |"
                echo "| 🧹 Code Smells | ${SMELLS} | $(rating_badge "$MNT_R") |"
                [ "$COV"  != "N/A" ] && echo "| 📊 Coverage | ${COV}% | — |"
                [ "$DUP"  != "N/A" ] && echo "| 🔄 Duplications | ${DUP}% | — |"
                [ "$LOC"  != "N/A" ] && echo "| 📝 Lines of Code | $(fmt_number "$LOC") | — |"
                [ "$DEBT" != "N/A" ] && echo "| 💳 Technical Debt | $(fmt_debt "$DEBT") | — |"
                echo ""

                NB=$(mn new_bugs); NV=$(mn new_vulnerabilities); NS=$(mn new_code_smells)
                NC=$(mn new_coverage); NH=$(mn new_security_hotspots)
                HAS_NEW=false
                for v in "$NB" "$NV" "$NS" "$NC" "$NH"; do [ "$v" != "N/A" ] && HAS_NEW=true && break; done

                if [ "$HAS_NEW" = "true" ]; then
                  echo "#### New Code Metrics"
                  echo ""
                  echo "| Metric | Value |"
                  echo "|--------|-------|"
                  [ "$NB" != "N/A" ] && echo "| 🐛 New Bugs | ${NB} |"
                  [ "$NV" != "N/A" ] && echo "| 🔒 New Vulnerabilities | ${NV} |"
                  [ "$NS" != "N/A" ] && echo "| 🧹 New Code Smells | ${NS} |"
                  [ "$NC" != "N/A" ] && echo "| 📊 New Coverage | ${NC}% |"
                  [ "$NH" != "N/A" ] && echo "| 🔥 New Security Hotspots | ${NH} |"
                  echo ""
                fi

                SEV_FACET=$(jq -r '
                  (.facets // [])[] | select(.property=="severities") |
                  .values[] | "| \(.val) | \(.count) |"
                ' "$D/issues.json" 2>/dev/null || true)
                if [ -n "$SEV_FACET" ]; then
                  echo "<details><summary>📊 Issue Severity Breakdown</summary>"
                  echo ""
                  echo "| Severity | Count |"
                  echo "|----------|-------|"
                  echo "$SEV_FACET"
                  echo ""
                  echo "</details>"
                  echo ""
                fi

                IC=$(jq '.issues | length' "$D/issues.json" 2>/dev/null || echo 0)
                IT=$(jq '.total // 0'     "$D/issues.json" 2>/dev/null || echo 0)
                REPO_URL="${SERVER_URL}/${REPO}"
                if [ "${IC:-0}" -eq 0 ] && [ "$QG_STATUS" != "OK" ]; then
                  echo "> No individual issues were returned from the API. The Quality Gate may have failed due to metric thresholds (e.g. coverage, ratings). Check the [SonarCloud dashboard](${SONAR_URL}/project/issues?id=${PROJECT_KEY}${SONAR_QS:-}) for details."
                  echo ""
                fi
                if [ "${IC:-0}" -gt 0 ]; then
                  echo "<details><summary>🔎 Top Issues (showing up to 15 of ${IT})</summary>"
                  echo ""
                  echo "| Severity | Type | Message | Location | Effort |"
                  echo "|----------|------|---------|----------|--------|"
                  jq -r --arg repo_url "${REPO_URL}" --arg sha "${SHA}" '
                    .issues[]? |
                    (.component | split(":") | last) as $f |
                    (.textRange.startLine // "—" | tostring) as $l |
                    (.effort // "—") as $e |
                    (.message | gsub("[|]";"\\|") | .[0:90]) as $m |
                    if $l != "—" then
                      "| \(.severity) | \(.type | gsub("_";" ")) | \($m) | [`\($f):\($l)`](\($repo_url)/blob/\($sha)/\($f)#L\($l)) | \($e) |"
                    else
                      "| \(.severity) | \(.type | gsub("_";" ")) | \($m) | `\($f)` | \($e) |"
                    end
                  ' "$D/issues.json" 2>/dev/null | head -15
                  echo ""
                  [ "${IT:-0}" -gt 15 ] && echo "_...and $((IT-15)) more. [View all in SonarCloud](${SONAR_URL}/project/issues?id=${PROJECT_KEY}${SONAR_QS:-})._" && echo ""
                  echo "</details>"
                  echo ""
                fi

                HC=$(jq '.hotspots | length'  "$D/hotspots.json" 2>/dev/null || echo 0)
                HT=$(jq '.paging.total // 0'  "$D/hotspots.json" 2>/dev/null || echo 0)
                if [ "${HC:-0}" -gt 0 ]; then
                  echo "<details><summary>🔥 Security Hotspots Requiring Review (${HT} total)</summary>"
                  echo ""
                  echo "| Probability | Category | Message | Location |"
                  echo "|-------------|----------|---------|----------|"
                  jq -r --arg repo_url "${REPO_URL}" --arg sha "${SHA}" '
                    .hotspots[]? |
                    (.component | split(":") | last) as $f |
                    (.textRange.startLine // "—" | tostring) as $l |
                    (.message | gsub("[|]";"\\|") | .[0:90]) as $m |
                    if $l != "—" then
                      "| \(.vulnerabilityProbability) | \(.securityCategory | gsub("-";" ") | ascii_upcase) | \($m) | [`\($f):\($l)`](\($repo_url)/blob/\($sha)/\($f)#L\($l)) |"
                    else
                      "| \(.vulnerabilityProbability) | \(.securityCategory | gsub("-";" ") | ascii_upcase) | \($m) | `\($f)` |"
                    end
                  ' "$D/hotspots.json" 2>/dev/null | head -10
                  echo ""
                  [ "${HT:-0}" -gt 10 ] && echo "_...and $((HT-10)) more. [Review all hotspots](${SONAR_URL}/project/security_hotspots?id=${PROJECT_KEY}${SONAR_QS:-})._" && echo ""
                  echo "</details>"
                  echo ""
                fi

                echo "</details>"
                echo ""
              done <<< "$(printf '%s' "${SONAR_PROJECTS:-[]}" | jq -r '.[].key' 2>/dev/null)"
            fi

            echo ""
            echo "---"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ── License Compliance section ──────────────────────────────────────
      - name: Report — license compliance
        if: always()
        continue-on-error: true
        shell: bash
        env:
          LICENCE_RESULT: ${{ needs.fast-checks.outputs.licence-result }}
        run: |
          set -uo pipefail
          LC_FILE="./reports/license/license-report.json"

          {
            echo "### ⚖️ License Compliance (Trivy)"
            echo ""

            if [ -z "${LICENCE_RESULT}" ]; then
              echo "⏭️ _Skipped or did not run (release events skip the licence scan)_"
            elif [ "${LICENCE_RESULT}" = "error" ]; then
              echo "**Status: ❌ The licence scan did not complete** — see the Licence scan step of Fast checks (install-command, Trivy config or report upload)"
            elif [ -f "$LC_FILE" ]; then
              TOTAL_PKGS=$(jq '.meta.total_packages // 0'    "$LC_FILE" 2>/dev/null || echo 0)
              VIOLATIONS=$(jq '.meta.violation_count // 0'   "$LC_FILE" 2>/dev/null || echo 0)
              FORBIDDEN_CFG=$(jq -r '(.meta.forbidden_licenses // []) | join(", ")' "$LC_FILE" 2>/dev/null || echo "—")
              RESTRICTED_COUNT=$(jq '[.results[]?.Licenses[]? | select(.Category=="restricted")] | length' "$LC_FILE" 2>/dev/null || echo 0)

              # Status derives from the scan verdict, not just the violation count.
              # Trivy can fail due to restricted (non-forbidden) licenses too.
              if   [ "$LICENCE_RESULT" = "findings" ] && [ "$VIOLATIONS" -gt 0 ]; then
                echo "**Status: ❌ ${VIOLATIONS} forbidden license violation(s) detected** (${TOTAL_PKGS} packages scanned)"
              elif [ "$LICENCE_RESULT" = "findings" ] && [ "$RESTRICTED_COUNT" -gt 0 ]; then
                echo "**Status: ⚠️ Scan failed — ${RESTRICTED_COUNT} restricted license(s) detected** (${TOTAL_PKGS} packages scanned)"
                echo ""
                echo "> Trivy flagged packages with **restricted** licenses (e.g. LGPL). These are not in the"
                echo "> forbidden list but may require review depending on your project's usage. Check with legal"
                echo "> if you distribute software containing LGPL components."
              elif [ "$LICENCE_RESULT" = "findings" ]; then
                echo "**Status: ❌ License scan failed** (${TOTAL_PKGS} packages scanned)"
              elif [ "$VIOLATIONS" -eq 0 ]; then
                echo "**Status: ✅ No forbidden violations detected** (${TOTAL_PKGS} packages scanned)"
              else
                echo "**Status: ❌ ${VIOLATIONS} violation(s) detected** (${TOTAL_PKGS} packages scanned)"
              fi
              echo ""
              [ -n "$FORBIDDEN_CFG" ] && [ "$FORBIDDEN_CFG" != "—" ] \
                && echo "> Forbidden licenses configured: \`${FORBIDDEN_CFG}\`" \
                && echo ""

              if [ "$VIOLATIONS" -gt 0 ]; then
                echo "#### Forbidden License Violations"
                echo ""
                echo "| Package | Version | License | Severity | Source File |"
                echo "|---------|---------|---------|----------|-------------|"
                jq -r '
                  .results[]? | .Target as $t | .Licenses[]? |
                  select(.Category=="forbidden") |
                  "| `\(.PkgName // "unknown")` | \(.PkgVersion // "—") | \(.Name) | \(.Severity // "—") | `\($t)` |"
                ' "$LC_FILE" 2>/dev/null | head -25
                VTOTAL=$(jq '[.results[]?.Licenses[]? | select(.Category=="forbidden")] | length' "$LC_FILE" 2>/dev/null || echo 0)
                [ "$VTOTAL" -gt 25 ] && echo "" && echo "_...and $((VTOTAL-25)) more. Download the \`license-report\` artifact for the full list._"
                echo ""
              fi

              if [ "$RESTRICTED_COUNT" -gt 0 ]; then
                echo "<details><summary>⚠️ Restricted Licenses Detected (${RESTRICTED_COUNT} — review required)</summary>"
                echo ""
                echo "| Package | Version | License | Severity | Source File |"
                echo "|---------|---------|---------|----------|-------------|"
                jq -r '
                  .results[]? | .Target as $t | .Licenses[]? |
                  select(.Category=="restricted") |
                  "| `\(.PkgName // "unknown")` | \(.PkgVersion // "—") | \(.Name) | \(.Severity // "—") | `\($t)` |"
                ' "$LC_FILE" 2>/dev/null | head -25
                RTOTAL=$(jq '[.results[]?.Licenses[]? | select(.Category=="restricted")] | length' "$LC_FILE" 2>/dev/null || echo 0)
                [ "$RTOTAL" -gt 25 ] && echo "" && echo "_...and $((RTOTAL-25)) more. Download the \`license-report\` artifact for the full list._"
                echo ""
                echo "</details>"
                echo ""
              fi

              ALL_LIC=$(jq -r '
                [.results[]?.Licenses[]? | {n:.Name, c:(.Category//"unknown")}] |
                unique_by(.n) | sort_by(.n) | .[] |
                "| `\(.n)` | \(.c) |"
              ' "$LC_FILE" 2>/dev/null | head -60)

              if [ -n "$ALL_LIC" ]; then
                echo "<details><summary>📋 Full License Inventory</summary>"
                echo ""
                echo "| License | Category |"
                echo "|---------|----------|"
                echo "$ALL_LIC"
                UNIQ=$(jq '[.results[]?.Licenses[]?.Name] | unique | length' "$LC_FILE" 2>/dev/null || echo "?")
                [ "${UNIQ:-0}" -gt 60 ] && echo "" && echo "_...and more. Download the \`license-report\` artifact for the complete list._"
                echo ""
                echo "</details>"
              fi
            else
              echo "Result: \`${LICENCE_RESULT}\` _(report artifact not available)_"
            fi

            echo ""
            echo "---"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Docker section: lint findings (per Dockerfile) + image CVEs ─────────
      - name: Report — Docker Best Practices
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RESULT_LINT:    ${{ needs.docker-lint.result }}
          RESULT_IMAGE:   ${{ needs.image.result }}
          DOCKER_TARGETS: ${{ needs.fast-checks.outputs.docker-targets }}
          DOCKER_COUNT:   ${{ needs.fast-checks.outputs.docker-count }}
          LINT_COUNT:     ${{ needs.fast-checks.outputs.lint-count }}
          IMAGE_COUNT:    ${{ needs.fast-checks.outputs.image-count }}
          DOCS_ONLY:      ${{ needs.fast-checks.outputs.docs-only }}
          EVENT:          ${{ github.event_name }}
          DIVE_MIN:       ${{ inputs.docker-dive-min-efficiency }}
        run: |
          set -uo pipefail

          status_icon() {
            case "$1" in
              success)   echo "✅ Passed"    ;;
              failure)   echo "❌ Failed"    ;;
              cancelled) echo "🚫 Cancelled" ;;
              skipped)   echo "⏭️ Skipped"  ;;
              *)         echo "⬜ Unknown"   ;;
            esac
          }

          {
            echo "### 🐳 Docker Best Practices"
            echo ""

            if [ "${DOCKER_COUNT:-0}" = "0" ] || [ -z "${DOCKER_COUNT:-}" ]; then
              echo "⏭️ _Skipped — no Dockerfile detected in this repository_"
              echo ""
              echo "> To enable the Docker pipeline, add a \`Dockerfile\` at the repo root or in"
              echo "> any subdirectory (e.g. \`apps/api/Dockerfile\`), set \`dockerfile:\`, or pass a"
              echo "> \`docker-targets\` list in your CI caller."
            elif [ "$RESULT_LINT" = "skipped" ] && [ "$RESULT_IMAGE" = "skipped" ]; then
              if [ "${DOCS_ONLY:-false}" = "true" ]; then
                echo "⏭️ _Skipped — documentation-only change_"
              else
                echo "⏭️ _Skipped — Dockerfile lint does not run on \`${EVENT}\` events_"
              fi
            else
              echo "**Dockerfile lint: $(status_icon "$RESULT_LINT") (${LINT_COUNT:-0} Dockerfile(s)) · Image build & scan: $(status_icon "$RESULT_IMAGE") (${IMAGE_COUNT:-0} image(s))**"
              echo ""

              # ── Lint findings — exact Hadolint/Checkov results per file ──
              LINT_FILES=$(find ./reports/docker-lint -name 'docker-lint-result.json' 2>/dev/null | sort || true)
              if [ -n "${LINT_FILES}" ]; then
                while IFS= read -r LF; do
                  [ -z "$LF" ] && continue
                  DF=$(jq -r '.dockerfile // "Dockerfile"'      "$LF" 2>/dev/null || echo "Dockerfile")
                  HO=$(jq -r '.hadolint_outcome // "unknown"'   "$LF" 2>/dev/null || echo "unknown")
                  CO=$(jq -r '.checkov_outcome // "unknown"'    "$LF" 2>/dev/null || echo "unknown")
                  HLN=$(jq '.hadolint_findings | length'        "$LF" 2>/dev/null || echo 0)
                  CKN=$(jq '.checkov_failed | length'           "$LF" 2>/dev/null || echo 0)
                  if [ "$HO" = "failure" ] || [ "$CO" = "failure" ]; then LICON="❌"; else LICON="✅"; fi

                  echo "<details><summary>${LICON} <code>${DF}</code> — Hadolint: ${HO}, Checkov: ${CO}</summary>"
                  echo ""
                  if [ "${CKN:-0}" -gt 0 ]; then
                    echo "**Failed Checkov checks (${CKN}):**"
                    echo ""
                    echo "| Check | Line | Message |"
                    echo "|-------|------|---------|"
                    jq -r '.checkov_failed[] | "| `\(.id)` | \(.line) | \(.msg | gsub("[|]";"\\|") | .[0:90]) |"' "$LF" 2>/dev/null | head -25
                    echo ""
                  fi
                  if [ "${HLN:-0}" -gt 0 ]; then
                    echo "**Hadolint findings (${HLN}):**"
                    echo ""
                    echo "| Rule | Level | Line | Message |"
                    echo "|------|-------|------|---------|"
                    jq -r '.hadolint_findings[] | "| `\(.id)` | \(.level) | \(.line) | \(.msg | gsub("[|]";"\\|") | .[0:80]) |"' "$LF" 2>/dev/null | head -25
                    echo ""
                  fi
                  if [ "${CKN:-0}" -eq 0 ] && [ "${HLN:-0}" -eq 0 ]; then
                    echo "All Hadolint and Checkov checks passed."
                    echo ""
                  fi
                  echo "</details>"
                  echo ""
                done <<< "${LINT_FILES}"
              elif [ "$RESULT_LINT" != "skipped" ]; then
                echo "$(status_icon "$RESULT_LINT") _(lint findings artifact unavailable — open the Dockerfile lint job log)_"
                echo ""
                printf '%s' "${DOCKER_TARGETS:-[]}" | jq -r '.[] | "> - `\(.dockerfile)`"' 2>/dev/null || true
                echo ""
              fi

              # ── CVE findings (image job) — one block per scanned image ──────
              DK_FILES=$(find ./reports/docker -name 'docker-vuln-report.json' 2>/dev/null | sort || true)
              GRAND_TOTAL=0
              while IFS= read -r DK_FILE; do
                [ -z "$DK_FILE" ] && continue
                IMAGE=$(jq -r '.meta.image // "unknown"'                 "$DK_FILE" 2>/dev/null || echo "unknown")
                DSHA=$(jq -r  '.meta.sha   // "unknown"'                 "$DK_FILE" 2>/dev/null || echo "unknown")
                SEV=$(jq -r   '.meta.severity_filter // "CRITICAL,HIGH"' "$DK_FILE" 2>/dev/null || echo "CRITICAL,HIGH")
                VULN_COUNT=$(jq '.meta.vulnerability_count // 0'         "$DK_FILE" 2>/dev/null || echo "0")
                GRAND_TOTAL=$((GRAND_TOTAL + VULN_COUNT))
                [ "$VULN_COUNT" -eq 0 ] && ST_ICON="✅" || ST_ICON="❌"

                echo "<details><summary>${ST_ICON} CVEs — <code>${IMAGE}</code> — ${VULN_COUNT} at ${SEV}</summary>"
                echo ""
                echo "> Image: \`${IMAGE}\` | Commit: \`${DSHA:0:7}\`"
                echo ""
                if [ "$VULN_COUNT" -gt 0 ]; then
                  echo "| Severity | Package | CVE | Title |"
                  echo "|----------|---------|-----|-------|"
                  jq -r '
                    .results[]? | .Target as $t |
                    .Vulnerabilities[]? |
                    ( .Severity // "UNKNOWN" ) as $sev |
                    ( .VulnerabilityID // "—" ) as $cve |
                    ( .PkgName // "unknown" ) as $pkg |
                    ( .Title // .Description // "—" | gsub("[|]";"\\|") | .[0:80] ) as $title |
                    "| \($sev) | `\($pkg)` | `\($cve)` | \($title) |"
                  ' "$DK_FILE" 2>/dev/null | sort -t'|' -k2 | head -20
                  TOTAL=$(jq '[.results[]?.Vulnerabilities // [] | length] | add // 0' "$DK_FILE" 2>/dev/null || echo 0)
                  [ "${TOTAL:-0}" -gt 20 ] && echo "" && echo "_...and $((TOTAL-20)) more. Download the \`docker-vuln-report*\` artifacts for the full list._"
                fi
                echo ""
                echo "</details>"
                echo ""
              done <<< "${DK_FILES}"

              if [ "${GRAND_TOTAL:-0}" -gt 0 ]; then
                echo "> **Remediation:** Update base images to patched versions, or pin specific"
                echo "> package versions and rebuild. Review the GitHub Security tab for SARIF findings."
                echo ""
              fi

              echo "<details><summary>📋 Docker pipeline sub-checks</summary>"
              echo ""
              echo "| Check | Tool | Job |"
              echo "|-------|------|-----|"
              echo "| Linting | Hadolint | Dockerfile lint |"
              echo "| IaC Security | Checkov | Dockerfile lint |"
              echo "| CVE Scan | Trivy (+ Grype if enabled) | Image (opt-in) |"
              echo "| Container SBOM | Syft (SPDX + CycloneDX) | Image (opt-in) |"
              echo "| Efficiency | Dive (threshold: \`${DIVE_MIN}\`) | Image (opt-in) |"
              echo ""
              echo "</details>"
            fi

            echo ""
            echo "---"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Release Please + SBOM + footer ───────────────────────────────────
      - name: Report — release and SBOM
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RESULT_RELEASE:  ${{ needs.release-please.result }}
          RESULT_SBOM:     ${{ needs.sbom.result }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release-created }}
          RELEASE_TAG:     ${{ needs.release-please.outputs.tag-name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_PATHS:   ${{ needs.release-please.outputs.paths-released }}
          RELEASE_TYPE:    ${{ inputs.release-type }}
          RELEASE_MANIFEST: ${{ inputs.release-manifest }}
          MAIN_BRANCH:     ${{ inputs.main-branch }}
          REPO:            ${{ github.repository }}
          SERVER_URL:      ${{ github.server_url }}
        run: |
          set -uo pipefail

          status_icon() {
            case "$1" in
              success)   echo "✅ Passed"    ;;
              failure)   echo "❌ Failed"    ;;
              cancelled) echo "🚫 Cancelled" ;;
              skipped)   echo "⏭️ Skipped"  ;;
              *)         echo "⬜ Unknown"   ;;
            esac
          }

          {
            echo "### 🏷️ Release Please"
            echo ""

            if [ "$RESULT_RELEASE" = "skipped" ]; then
              echo "⏭️ _Skipped_"
              echo ""
              if [ -z "${RELEASE_TYPE:-}" ] && [ "${RELEASE_MANIFEST:-}" != "true" ]; then
                echo "> No \`release-type\` or \`release-manifest\` configured for this repository."
              else
                echo "> Only runs on push to \`${MAIN_BRANCH}\`."
              fi
            elif [ "${RELEASE_CREATED:-}" = "true" ] && [ -n "${RELEASE_TAG:-}" ]; then
              # Single-package release (one tag)
              echo "**🚀 Release created: [\`${RELEASE_TAG}\`](${SERVER_URL}/${REPO}/releases/tag/${RELEASE_TAG})**"
              echo ""
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| Version | \`${RELEASE_VERSION}\` |"
              echo "| Tag | \`${RELEASE_TAG}\` |"
              echo "| Release notes | [${RELEASE_TAG}](${SERVER_URL}/${REPO}/releases/tag/${RELEASE_TAG}) |"
              echo "| SBOM | Attached to release assets |"
            elif [ "${RELEASE_CREATED:-}" = "true" ]; then
              # Manifest release — one or more packages, no single tag
              echo "**🚀 Release(s) created (manifest mode)**"
              echo ""
              echo "Released package paths:"
              echo ""
              echo '```json'
              echo "${RELEASE_PATHS:-[]}"
              echo '```'
              echo ""
              echo "> See the [Releases page](${SERVER_URL}/${REPO}/releases) for per-package tags and notes."
            else
              echo "$(status_icon "$RESULT_RELEASE")"
              echo ""
              echo "> No release created this run — Release PR may be open and waiting for merge."
              echo "> [View open Release PRs](${SERVER_URL}/${REPO}/pulls?q=is%3Aopen+label%3Autorelease%3Apending)"
            fi

            echo ""
            echo "---"
            echo ""
            echo "### 📦 SBOM Generation"
            echo ""

            if [ "$RESULT_SBOM" = "skipped" ]; then
              echo "⏭️ _Skipped — only runs on push to \`${MAIN_BRANCH}\` or release events_"
            else
              echo "$(status_icon "$RESULT_SBOM")"
              echo ""
              echo "| Format | Artifact |"
              echo "|--------|----------|"
              echo "| SPDX JSON | \`sbom-spdx.json\` |"
              echo "| CycloneDX JSON | \`sbom-cyclonedx.json\` |"
              if [ "${RELEASE_CREATED:-}" = "true" ]; then
                echo ""
                echo "> Both files attached to [Release ${RELEASE_TAG}](${SERVER_URL}/${REPO}/releases/tag/${RELEASE_TAG})."
              fi
            fi

            echo ""
            echo "---"
            echo ""
            echo "<sub>Report generated · [Orion Digital Solutions](https://www.orion360.com/)</sub>"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Verdict (the required check) ─────────────────────────────────────
      # Decided from job results and fast-checks outputs only (step outputs
      # recorded before any caller code ran), never from the report above.
      #   fail: any needed job failure/cancelled;
      #         fast-checks skipped on a non-release event;
      #         fast-checks green but a scan verdict (secret, licence and,
      #         when enabled, dependency) not clean (belt and braces:
      #         caller code in install-command could only have neutralised
      #         the job's own failing step, not these outputs).
      #   pass: everything else, including jobs the plan gated off (skipped).
      - name: CI gate verdict
        if: always()
        shell: bash
        env:
          EVENT:          ${{ github.event_name }}
          R_FAST:         ${{ needs.fast-checks.result }}
          R_SONAR:        ${{ needs.sonarcloud.result }}
          R_LINT:         ${{ needs.docker-lint.result }}
          R_IMAGE:        ${{ needs.image.result }}
          R_PUBLISH:      ${{ needs.image-publish.result }}
          R_RELEASE:      ${{ needs.release-please.result }}
          R_SBOM:         ${{ needs.sbom.result }}
          SECRET_RESULT:  ${{ needs.fast-checks.outputs.secret-result }}
          LICENCE_RESULT: ${{ needs.fast-checks.outputs.licence-result }}
          DEP_ENABLED:    ${{ inputs.dependency-scan }}
          DEP_RESULT:     ${{ needs.fast-checks.outputs.dependency-result }}
        run: |
          set -u
          FAIL=0
          for pair in "Fast checks=${R_FAST}" "SonarCloud=${R_SONAR}" "Dockerfile lint=${R_LINT}" \
                      "Image=${R_IMAGE}" "Publish container SBOMs=${R_PUBLISH}" \
                      "Release Please=${R_RELEASE}" "SBOM Generation=${R_SBOM}"; do
            name="${pair%%=*}"; result="${pair#*=}"
            echo "${name}: ${result}"
            case "${result}" in
              failure|cancelled) echo "::error::${name}: ${result}"; FAIL=1 ;;
            esac
          done
          if [ "${EVENT}" != "release" ]; then
            if [ "${R_FAST}" = "skipped" ]; then
              echo "::error::Fast checks was skipped on a '${EVENT}' event; it must always run."
              FAIL=1
            elif [ "${R_FAST}" = "success" ]; then
              CHECKS=("Secret scan=${SECRET_RESULT}" "Licence scan=${LICENCE_RESULT}")
              [ "${DEP_ENABLED}" = "true" ] && CHECKS+=("Dependency scan=${DEP_RESULT}")
              for pair in "${CHECKS[@]}"; do
                if [ "${pair#*=}" != "clean" ]; then
                  echo "::error::${pair%%=*}: '${pair#*=}' (expected 'clean') although Fast checks succeeded."
                  FAIL=1
                fi
              done
            fi
          fi
          if [ "${FAIL}" -ne 0 ]; then
            echo "CI gate: FAILED"
            echo "**CI gate: ❌ failed** — see the job results above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "CI gate: passed"
          echo "**CI gate: ✅ passed**" >> "$GITHUB_STEP_SUMMARY"
