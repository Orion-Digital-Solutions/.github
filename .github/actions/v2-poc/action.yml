name: v2 packaging probe
description: >-
  ROADMAP 6.1 proof of concept (see docs/v2-design.md). Shows that a composite
  action in this repository can call a sibling action with the self-repository
  reference `$/`, that the sibling comes from the same commit as this file,
  and that files planted in the caller's workspace are not picked up.
  Delete once the v2 composite actions exist.

inputs:
  plant-decoy:
    description: >-
      Write a fake copy of the inner action into the caller's workspace at the
      path `$/` points to, before calling it. If `$/` read the workspace (as
      `./` does), the probe would get the decoy marker and fail.
    required: false
    default: "false"

outputs:
  marker:
    description: Marker the inner action read from a file shipped next to it.
    value: ${{ steps.inner.outputs.marker }}

runs:
  using: composite
  steps:
    - name: Show where this action was downloaded to
      shell: bash
      run: echo "Outer action at ${GITHUB_ACTION_PATH}"

    - name: Plant a decoy inner action in the workspace
      if: inputs.plant-decoy == 'true'
      shell: bash
      run: |
        set -euo pipefail
        decoy="${GITHUB_WORKSPACE}/.github/actions/v2-poc/inner"
        mkdir -p "${decoy}"
        printf 'decoy\n' > "${decoy}/marker.txt"
        cp "${GITHUB_ACTION_PATH}/inner/action.yml" "${decoy}/action.yml"
        echo "Planted decoy at ${decoy}"

    - name: Call the sibling action by self-repository reference
      id: inner
      uses: $/.github/actions/v2-poc/inner

    # WANT must equal inner/marker.txt in the same commit. To test version
    # skew, change both in a later commit and run the probe pinned to the
    # earlier SHA: it must still pass.
    - name: Check the sibling came from this commit
      shell: bash
      env:
        GOT: ${{ steps.inner.outputs.marker }}
        WANT: v2-poc-1
      run: |
        if [ "${GOT}" != "${WANT}" ]; then
          echo "::error::Inner action returned '${GOT}', expected '${WANT}'. \$/ did not resolve to this action's own commit."
          exit 1
        fi
        echo "OK: inner action returned '${GOT}' from this commit."
