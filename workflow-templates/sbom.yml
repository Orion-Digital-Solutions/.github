name: SBOM Generation

on:
  push:
    branches: [main]
  release:
    types: [created]

# Token permissions: the maximum the shared workflow requests. GitHub
# validates these at start-up even for jobs that are skipped (e.g. attestation,
# off by default), and each shared job narrows them further.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sbom:
    name: SBOM Generation
    uses: orion-digital-solutions/.github/.github/workflows/sbom.yml@main
    # Uncomment `with:` together with any option below. An empty `with:` is invalid.
    # with:
      # scan-path: "."                     # default: repo root
      # artifact-name: "sbom"              # default
      # artifact-retention-days: 30        # default
      # attach-to-release: true            # default — attaches to GitHub Release
      # attest: false                      # set true to publish signed attestation
