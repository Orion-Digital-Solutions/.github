name: Node.js CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Read-only token: this workflow only checks out and tests the code.
permissions:
  contents: read

jobs:
  # Actions are pinned to a commit SHA with the version in a comment. Dependabot
  # does not scan workflow-templates/, so bump these pins by hand together with
  # the shared workflows in .github/workflows/.
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [22, 24, 26]  # maintained releases as of Nov 2026 (18 and 20 are end-of-life)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Run tests
        run: npm test --if-present
