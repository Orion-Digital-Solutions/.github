name: Node.js CI

# Triggers: `push` runs only on the default branch, and `pull_request` covers
# every other branch, so a commit on a branch with an open PR starts one run,
# not two. Add a long-lived branch (e.g. develop) to `push.branches` only if it
# needs CI without an open PR.
on:
  push:
    branches: [main]
  pull_request:

# A new commit on a PR cancels that PR's run still in progress. Other events
# get their own group (the run id), so main-branch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: this workflow only checks out and tests the code.
permissions:
  contents: read

jobs:
  # Actions are pinned to a commit SHA with the version in a comment. Dependabot
  # does not scan workflow-templates/, so bump these pins by hand together with
  # the shared workflows in .github/workflows/.
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [22, 24, 26]  # maintained releases as of Nov 2026 (18 and 20 are end-of-life)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Run tests
        run: npm test --if-present
