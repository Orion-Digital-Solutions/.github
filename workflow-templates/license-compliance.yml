name: License Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan to catch license changes introduced by Dependabot
    - cron: "0 7 * * 1"

# Token permissions: the maximum the shared workflow requests. GitHub
# validates these at start-up even for steps that are skipped (e.g. the SARIF
# upload), and each shared job narrows them further.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  license-check:
    name: License Compliance
    uses: orion-digital-solutions/.github/.github/workflows/license-compliance.yml@v2
    # Uncomment `with:` together with any option below. An empty `with:` is invalid.
    # with:
      # Default forbidden list covers copyleft licenses (GPL, AGPL, LGPL).
      # Override here if this project has specific licence requirements.
      # forbidden-licenses: "GPL-2.0,GPL-3.0,AGPL-3.0"
      #
      # Path to scan (default: repo root).
      # scan-path: "."
      #
      # Install production dependencies first so Trivy can read licences that
      # lock files don't carry (pip, pnpm, Yarn, Go). See the shared workflow.
      # install-command: "npm ci --omit=dev"
