name: Python CI

# Triggers: `push` runs only on the default branch, and `pull_request` covers
# every other branch, so a commit on a branch with an open PR starts one run,
# not two. Add a long-lived branch (e.g. develop) to `push.branches` only if it
# needs CI without an open PR.
on:
  push:
    branches: [main]
  pull_request:

# A new commit on a PR cancels that PR's run still in progress. Other events
# get their own group (the run id), so main-branch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: this workflow only checks out, tests, and uploads an artifact.
permissions:
  contents: read

jobs:
  # Actions are pinned to a commit SHA with the version in a comment. Dependabot
  # does not scan workflow-templates/, so bump these pins by hand together with
  # the shared workflows in .github/workflows/.
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]  # 3.10 reached end-of-life in Oct 2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
