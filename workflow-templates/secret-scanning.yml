name: Secret Scanning

# Triggers: `push` runs only on the default branch, and `pull_request` covers
# every other branch, so a commit on a branch with an open PR starts one run,
# not two. Add a long-lived branch (e.g. develop) to `push.branches` only if it
# needs scanning without an open PR.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Full history scan every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

# A new commit on a PR cancels that PR's run still in progress. Other events
# get their own group (the run id), so main-branch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Token permissions: the maximum the shared workflow requests. GitHub
# validates these at start-up, and each shared job narrows them further.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning
    uses: orion-digital-solutions/.github/.github/workflows/secret-scanning.yml@v1
    with:
      # On scheduled runs, scan full git history.
      # On push/PR, only the delta is scanned (default).
      full-scan: ${{ github.event_name == 'schedule' }}
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
