name: Stale Issue & PR Management

on:
  schedule:
    # Weekly, Monday 01:00 UTC (off-peak, to minimise rate-limit pressure).
    # Was daily: every run bills at least one full minute, so daily cost ~30
    # billed minutes a month per repository for a job that only needs to
    # notice inactivity measured in weeks. The 60/30-day stale windows below
    # make a weekly check enough; a mark or close can land up to 6 days later.
    - cron: "0 1 * * 1"
  workflow_dispatch:  # Allow manual trigger for initial clean-up

# Token permissions: the maximum the shared workflow requests. GitHub
# validates these at start-up, and each shared job narrows them further.
permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale Issue & PR Management
    uses: orion-digital-solutions/.github/.github/workflows/stale.yml@v1
    with:
      # ── Issues ─────────────────────────────────────────────────────────────
      # Mark stale after 60 days of inactivity; close 14 days after that.
      days-before-issue-stale: 60
      days-before-issue-close: 14

      # ── Pull Requests ───────────────────────────────────────────────────────
      # PRs move faster — mark stale after 30 days; close 7 days after that.
      days-before-pr-stale: 30
      days-before-pr-close: 7

      # ── Exempt labels ───────────────────────────────────────────────────────
      # Issues or PRs with any of these labels will never be marked stale.
      # Add more labels as needed (comma-separated, no spaces).
      exempt-issue-labels: "pinned,security,in-progress,blocked"
      exempt-pr-labels: "in-progress,blocked,do-not-merge"
